                                                <div className="py-20 text-center border border-dashed border-white/20 rounded-3xl bg-white/5">
                                                    <UserCircle size={48} className="mx-auto mb-4 opacity-20" />
                                                    <p className="text-white/60 font-medium">Nenhum grupo criado. Seja o pioneiro!</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 pb-20">
                                                    {studentCommunities.map(comm => {
                                                        const isCreator = comm.creatorId === user.uid;
                                                        const isMember = (comm.members || []).includes(user.uid) || isCreator;
                                                        const isPending = (comm.pendingRequests || []).includes(user.uid);

                                                        return (
                                                            <div key={comm.id} onClick={() => { if(isMember) { setActiveCommunity(comm); setCommunityTab('feed'); } }} className={`bg-[#111] border border-white/10 rounded-[1.5rem] transition-all group flex flex-col shadow-lg relative overflow-hidden ${isMember ? 'cursor-pointer hover:border-indigo-500/50 hover:shadow-[0_10px_30px_rgba(79,70,229,0.2)] hover:-translate-y-1' : ''}`}>
                                                                
                                                                {/* Mini Capa */}
                                                                <div className="w-full h-24 bg-slate-800 relative">
                                                                    {comm.coverUrl ? (
                                                                        <img src={comm.coverUrl} className={`w-full h-full object-cover ${comm.banned ? 'grayscale opacity-50' : ''}`} alt="Capa" />
                                                                    ) : (
                                                                        <div className="w-full h-full bg-gradient-to-r from-indigo-900 to-purple-900"></div>
                                                                    )}
                                                                    {comm.banned && <div className="absolute top-2 right-2 bg-red-600 text-white text-[9px] font-black px-2 py-1 rounded shadow-md z-10 flex items-center gap-1"><Lock size={10}/> SUSPENSA</div>}
                                                                </div>

                                                                <div className="px-5 pb-5 relative flex flex-col flex-1">
                                                                    {/* Avatar Sobreposto */}
                                                                    <div className="-mt-8 mb-3 relative z-10">
                                                                        <div className={`w-16 h-16 rounded-full overflow-hidden border-4 border-[#111] shrink-0 shadow-lg bg-slate-700 flex items-center justify-center font-black text-xl text-white ${comm.banned ? 'grayscale border-red-900/50 text-red-500' : ''}`}>
                                                                            {comm.avatarUrl ? <img src={comm.avatarUrl} className="w-full h-full object-cover"/> : comm.name.charAt(0).toUpperCase()}
                                                                        </div>
                                                                    </div>

                                                                    <div className="flex-1">
                                                                        <h4 className={`text-lg font-black line-clamp-1 mb-1 tracking-tight ${comm.banned ? 'text-red-400' : 'text-white'}`}>{comm.name}</h4>
                                                                        <p className="text-xs text-white/50 line-clamp-2 leading-relaxed mb-4">{comm.description}</p>
                                                                    </div>

                                                                    <div className="flex items-center gap-3 text-[10px] uppercase tracking-widest text-white/40 font-bold mb-4">
                                                                        <span className="flex items-center gap-1"><UserCircle size={12}/> Líder: {comm.creatorName?.split(' ')[0]}</span>
                                                                        <span className="flex items-center gap-1"><User size={12}/> {(comm.members || [comm.creatorId]).length} Membros</span>
                                                                    </div>

                                                                    <div className="mt-auto border-t border-white/5 pt-4">
                                                                        {isCreator ? (
                                                                            <button onClick={(e) => { e.stopPropagation(); setManagingComm(comm); }} className="w-full py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-xs font-bold transition-all border border-white/10 flex items-center justify-center gap-2">
                                                                                <Settings size={16} /> Gerenciar
                                                                            </button>
                                                                        ) : isMember ? (
                                                                            <button onClick={() => { setActiveCommunity(comm); setCommunityTab('feed'); }} className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all shadow-md flex items-center justify-center gap-2">
                                                                                <Eye size={16} /> Acessar Tribo
                                                                            </button>
                                                                        ) : isPending ? (
                                                                            <button onClick={(e) => { e.stopPropagation(); handleCancelRequest(comm.id); }} className="w-full py-2.5 bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-500 rounded-xl text-xs font-bold transition-all border border-yellow-500/30 flex items-center justify-center gap-2">
                                                                                <Clock size={16} /> Cancelar Pedido
                                                                            </button>
                                                                        ) : (
                                                                            <button onClick={(e) => { e.stopPropagation(); handleRequestJoin(comm.id); }} className="w-full py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-xs font-bold transition-all border border-white/10 flex items-center justify-center gap-2">
                                                                                <User size={16} /> Solicitar Entrada
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            )}

            {/* CHAT PRIVADO */}
            {communityTab === 'mensagens' && (
                <div className="flex w-full h-full pt-[80px] md:pt-[100px] px-2 md:px-6 pb-4">
                    {renderChatInterface()}
                </div>
            )}
        </div>
    );
};
// =================================================================================
// FIM DO COMPONENTE COMUNIDADE
// =================================================================================

   
   
 // =================================================================================
    // COMPONENTE: MEUS FAVORITOS (MAIOR NO PC, ULTRA COMPACTO NO CELULAR)
    // =================================================================================
    const FavoritesSection = ({ user, courses, onSelectCourse }) => {
        const [favorites, setFavorites] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const fetchFavorites = async () => {
                if(!db || !user) return;
                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    
                    if(userSnap.exists()){
                        const data = userSnap.data();
                        const favoriteIds = data.favoriteLessons || [];
                        
                        let favList = [];
                        if (courses && courses.length > 0) {
                            courses.forEach(course => {
                                if(course.modulos) {
                                    course.modulos.forEach((mod, mIdx) => {
                                        if(mod.aulas) {
                                            mod.aulas.forEach((lesson, lIdx) => {
                                                const uniqueId = `${course.id}_m${mIdx}_l${lIdx}`;
                                                if(favoriteIds.includes(uniqueId)) {
                                                    favList.push({
                                                        ...lesson,
                                                        courseId: course.id,
                                                        courseData: course,
                                                        courseName: course.title || course.titulo,
                                                        moduleName: mod.titulo
                                                    });
                                                }
                                            });
                                        }
                                    });
                                }
                            });
                        }
                        setFavorites(favList);
                    }
                } catch(e) {
                    console.error("Erro ao carregar favoritos", e);
                } finally {
                    setLoading(false);
                }
            };
            fetchFavorites();
        }, [user, courses]);

        if(loading) return <div className="flex justify-center items-center h-64"><div className="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;

        return (
            <div className="space-y-4 md:space-y-10 animate-fade-in max-w-[100rem] mx-auto mt-16 md:mt-28 mb-10 px-3 md:px-8 lg:px-12 font-sans">
                
                {/* HEADER (Mais compacto no mobile) */}
                <div className="flex items-center gap-2 md:gap-5 mb-3 md:mb-8 px-1">
                    <div className="p-2 md:p-5 bg-pink-100 dark:bg-pink-900/30 text-pink-600 dark:text-pink-400 rounded-lg md:rounded-2xl shadow-inner">
                        <Heart className="w-5 h-5 md:w-8 md:h-8" />
                    </div>
                    <div>
                        <h2 className="text-xl md:text-4xl font-black text-slate-800 dark:text-white tracking-tight">Aulas Favoritas</h2>
                        <p className="text-slate-500 dark:text-slate-400 text-[10px] md:text-base mt-0.5 md:mt-1.5">Seus conteúdos salvos para acesso rápido.</p>
                    </div>
                </div>

                {/* CASO NÃO TENHA FAVORITOS */}
                {favorites.length === 0 ? (
                    <div className="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl md:rounded-3xl p-8 md:p-16 flex flex-col items-center justify-center text-center bg-slate-50/50 dark:bg-slate-900/50 min-h-[200px] md:min-h-[300px]">
                        <div className="w-12 h-12 md:w-20 md:h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-400 mb-3 md:mb-6 shadow-inner">
                            <Heart className="w-6 h-6 md:w-10 md:h-10" />
                        </div>
                        <h4 className="font-extrabold text-base md:text-2xl text-slate-700 dark:text-slate-200 mb-1.5 md:mb-3">Nenhum favorito encontrado</h4>
                        <p className="text-slate-500 text-xs md:text-base max-w-sm md:max-w-lg leading-relaxed">Você ainda não marcou nenhuma aula como favorita. Navegue pelos cursos e clique na estrelinha para salvar aqui!</p>
                    </div>
                ) : (
                    // GRADE IDÊNTICA À ABA DE CONQUISTAS (1 coluna no Celular, 2 no Tablet, 3 no PC)
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {favorites.map((fav, index) => (
                            <div 
                                key={index} 
                                onClick={() => onSelectCourse(fav.courseData)}

 // =================================================================================
// COMPONENTE: CARTEIRA DE PONTOS E RECOMPENSAS (COM GAMIFICAÇÃO E MOEDA PERSONALIZADA)
// =================================================================================
const PointsWalletSection = ({ user, courses, purchasedIds, userPoints, db, setPurchasedIds, showNotification, requestConfirmation }) => {
    const [isProcessing, setIsProcessing] = useState(false);
    
    // Novos Estados para buscar as configurações e os Níveis do Banco de Dados
    const [coinName, setCoinName] = useState({ s: 'Ponto', p: 'Pontos' });
    const [levels, setLevels] = useState([]);
    const [userTotalEarned, setUserTotalEarned] = useState(0);

    useEffect(() => {
        if (!db) return;
        
        // 1. Busca o nome personalizado da Moeda
        getDoc(doc(db, "config", "general_settings")).then(snap => {
            if (snap.exists()) {
                const data = snap.data();
                setCoinName({ s: data.coinNameSingular || 'Ponto', p: data.coinNamePlural || 'Pontos' });
            }
        });

        // 2. Busca a Escada de Níveis (Ordenada do menor pro maior)
        const unsubLevels = onSnapshot(query(collection(db, "student_levels"), orderBy("requiredPoints", "asc")), snap => {
            setLevels(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });

        // 3. Busca o Total Histórico ganho pelo usuário (para calcular o nível)
        const unsubUser = onSnapshot(doc(db, "users", user.uid), snap => {
            if (snap.exists()) {
                setUserTotalEarned(snap.data().pointsEarned || 0);
            }
        });

        return () => { unsubLevels(); unsubUser(); };
    }, [db, user.uid]);

    // O Sistema descobre em qual Nível o aluno está:
    const currentLevel = [...levels].sort((a,b) => (b.requiredPoints || 0) - (a.requiredPoints || 0)).find(l => userTotalEarned >= (l.requiredPoints || 0));

    const handleExchange = async (course) => {
        if (userPoints < course.pointsCost) {
            showNotification(`Saldo insuficiente. Faltam ${course.pointsCost - userPoints} ${coinName.p.toLowerCase()}.`, "error");
            return;
        }
        
        requestConfirmation(
            "Confirmar Troca",
            `Deseja investir ${course.pointsCost} ${coinName.p.toLowerCase()} para liberar o curso "${course.title || course.titulo}"?`,
            "Confirmar Troca",
            async () => {
                setIsProcessing(true);
                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const uData = userSnap.data();
                        await updateDoc(userRef, {
                            pointsSpent: (Number(uData.pointsSpent) || 0) + Number(course.pointsCost),
                            pointsBalance: (Number(uData.pointsBalance) || 0) - Number(course.pointsCost)
                        });
                    }

                    await addDoc(collection(db, "transactions"), {
                        courseId: course.id, courseTitle: course.title || course.titulo, userId: user.uid, userName: user.displayName || 'Aluno',
                        userEmail: user.email, valor: 0, status: 'pago', method: 'points_exchange', pointsCost: course.pointsCost,
                        createdAt: new Date(), updatedAt: new Date()
                    });

                    setPurchasedIds(prev => [...prev, course.id]);
                    showNotification("Troca realizada com sucesso! O curso já está liberado.", "success");

                    // 👇 DISPARO DE E-MAIL (RESGATE POR PONTOS) 👇
                    let capaDoCurso = course.cover || course.thumbnailUrl || "https://images.unsplash.com/photo-1616469829941-c7200edec809?q=80&w=600";
                    fetch("https://script.google.com/macros/s/AKfycbzyuxuOw0fx5YiAWuE_PaN8JE9VrupAStYQfKk6fFDMiLMn7BARtbLagoF3sPbhg9A/exec", {
                        method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            to: user.email,
                            userName: user.displayName || 'Aluno',
                            itemName: course.title || course.titulo,
                            itemImage: capaDoCurso,
                            itemType: "course", // MUDADO PARA COURSE PARA LIBERAR ACESSO
                            subject: "Seu Acesso via Recompensa foi Liberado!",
                            titleHeader: "RECOMPENSA LIBERADA",
                            message: `Parabéns! Você resgatou "${course.title || course.titulo}" utilizando seus pontos. O seu acesso ao curso já foi liberado na área do aluno.`
                        })
                    }).catch(e => console.log("Erro no e-mail de resgate: ", e));
                    // 👆 FIM DO DISPARO 👇

                } catch (error) {
                    showNotification("Erro ao processar a troca. Tente novamente.", "error");
                } finally {
                    setIsProcessing(false);
                }
            }
        ); 
    };

    const rewardCourses = courses.filter(c => Number(c.pointsCost) > 0);

    return (
        <div className="space-y-4 md:space-y-8 animate-fade-in max-w-[100rem] mx-auto pt-2 md:pt-6 pb-10 px-3 md:px-8 lg:px-12 font-sans">
            
            <div className="bg-gradient-to-br from-amber-500/20 to-[#0a0a0f] border border-amber-500/30 rounded-[1.5rem] md:rounded-[2rem] p-5 md:p-12 shadow-[0_0_40px_rgba(245,158,11,0.1)] relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-4 md:gap-8">
                <div className="absolute top-0 right-0 w-32 h-32 md:w-64 md:h-64 bg-amber-500/10 blur-[40px] md:blur-[80px] rounded-full pointer-events-none"></div>
                
                <div className="relative z-10 flex items-center gap-3 md:gap-6 w-full md:w-auto">
                    <div className="w-12 h-12 md:w-20 md:h-20 bg-amber-500/20 rounded-full flex items-center justify-center border border-amber-500/50 shadow-[0_0_20px_rgba(245,158,11,0.4)] shrink-0">
                        <Star className="w-6 h-6 md:w-10 md:h-10 text-amber-400 fill-amber-400" />
                    </div>
                    <div>
                        <h2 className="text-xl md:text-4xl font-black text-white tracking-tight">Sua Carteira</h2>
                        <p className="text-amber-400/80 font-medium mt-0.5 md:mt-1 text-[9px] md:text-sm uppercase tracking-widest">Saldo Disponível</p>
                    </div>
                </div>

                {/* Bloco de Nível e Saldo da Moeda Personalizada */}
                <div className="flex flex-col md:flex-row items-center gap-4 relative z-10">
                    {/* Exibição Dinâmica do Nível (Gamificação) */}
                    {currentLevel && (
                        <div className="flex items-center gap-3 bg-black/40 backdrop-blur-md px-4 py-2 md:px-6 md:py-3 rounded-2xl border border-white/10">
                            <div className="w-10 h-10 md:w-14 md:h-14 rounded-full overflow-hidden border border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.5)]">
                                <img src={currentLevel.badgeUrl} alt="Emblema" className="w-full h-full object-cover" />
                            </div>
                            <div className="text-left">
                                <p className="text-[8px] md:text-[10px] text-amber-400 font-bold uppercase tracking-widest">Seu Nível Atual</p>
                                <h3 className="text-base md:text-xl font-black text-white leading-none">{currentLevel.name}</h3>
                            </div>
                        </div>
                    )}

                    <div className="text-center md:text-right bg-black/40 backdrop-blur-md px-6 md:px-8 py-3 md:py-4 rounded-2xl md:rounded-3xl border border-white/10 w-full md:w-auto">
                        <span className="block text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-amber-500 drop-shadow-sm">
                            {userPoints}
                        </span>
                        <span className="text-white/50 text-[8px] md:text-[10px] font-bold uppercase tracking-widest mt-1 block">{coinName.p} Acumulados</span>
                    </div>
                </div>
            </div>

            <div>
                <div className="flex items-center gap-2 md:gap-3 mb-3 md:mb-6 px-1">
                    <ShoppingBag className="w-4 h-4 md:w-6 md:h-6 text-white/60" />
                    <h3 className="text-lg md:text-2xl font-black text-white tracking-tight">Loja de Recompensas</h3>
                </div>

                {rewardCourses.length === 0 ? (
                    <div className="border border-dashed border-white/10 rounded-2xl md:rounded-3xl p-8 md:p-12 text-center bg-white/[0.02]">
                        <p className="text-white/50 text-xs md:text-lg">Nenhum curso disponível para troca no momento.</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 md:gap-6">
                        {rewardCourses.map(course => {
                            const isOwned = purchasedIds.includes(course.id);
                            const canAfford = userPoints >= course.pointsCost;

                            return (
                                <div key={course.id} className="group relative w-full aspect-[2/3] rounded-xl md:rounded-2xl overflow-hidden shadow-lg hover:shadow-[0_15px_30px_rgba(245,158,11,0.2)] hover:-translate-y-1 transition-all duration-500 border border-white/10 bg-[#0a0a0f]">
                                    <img src={course.cover || "https://via.placeholder.com/600"} alt={course.title} className="absolute inset-0 w-full h-full object-cover opacity-80 group-hover:scale-110 transition-transform duration-700" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/70 to-transparent opacity-100 transition-opacity duration-500"></div>

                                    <div className="absolute top-2 md:top-3 left-1/2 -translate-x-1/2 bg-[#0a0a0f]/90 backdrop-blur-md border border-amber-500/40 px-2.5 py-1 md:px-3 md:py-1.5 rounded-full flex items-center gap-1 md:gap-1.5 shadow-[0_0_15px_rgba(245,158,11,0.5)] z-20">
                                        <Star className="w-3 h-3 md:w-3.5 md:h-3.5 text-amber-400 fill-amber-400" />
                                        <span className="text-amber-400 font-bold text-[9px] md:text-[10px] whitespace-nowrap">{course.pointsCost} {coinName.s.toLowerCase()}</span>
                                    </div>

                                    <div className="absolute inset-x-0 bottom-0 p-3 md:p-4 flex flex-col z-20">
                                        <h4 className="text-white font-bold text-xs md:text-[13px] mb-2 md:mb-3 line-clamp-2 leading-tight drop-shadow-md text-left">{course.title || course.titulo}</h4>
                                        {isOwned ? (
                                            <button disabled className="w-full py-2 md:py-2.5 rounded-lg md:rounded-xl bg-green-500/10 text-green-400 border border-green-500/20 font-bold text-[9px] md:text-[10px] uppercase tracking-widest flex items-center justify-center gap-1.5 backdrop-blur-md">
                                                <CheckCircle className="w-3.5 h-3.5 md:w-4 md:h-4" /> Resgatado
                                            </button>
                                        ) : (
                                            <button onClick={() => handleExchange(course)} disabled={!canAfford || isProcessing} className={`w-full py-2 md:py-2.5 rounded-lg md:rounded-xl font-bold text-[9px] md:text-[10px] uppercase tracking-widest flex items-center justify-center gap-1.5 transition-all backdrop-blur-sm ${canAfford ? 'bg-amber-500 hover:bg-amber-400 text-black shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'bg-white/5 text-white/30 border border-white/10 cursor-not-allowed'}`}>
                                                {isProcessing ? <div className="w-3.5 h-3.5 border-2 border-current border-t-transparent rounded-full animate-spin"></div> : canAfford ? <>Trocar</> : <><Lock className="w-3 h-3 md:w-3.5 md:h-3.5 opacity-60" /> Faltam {coinName.p}</>}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
        </div>
    );
};

// COMPONENTE: MEUS CURSOS (BLINDADO CONTRA ERRO DE CLICK / STOP_PROPAGATION)
// =================================================================================
const MyCoursesSection = ({ courses, purchasedIds, onSelectCourse, user, db, setPurchasedIds, showNotification, settings, requestConfirmation }) => {
    // Filtra para mostrar apenas os cursos cujo ID está na lista de comprados
    const myCourses = courses.filter(course => purchasedIds.includes(course.id));

    // 👇 NOVO: ESTADO DO MODAL DE CANCELAMENTO DE CURSOS 👇
    const [cancelModal, setCancelModal] = useState({ isOpen: false, course: null, reason: '', customText: '', isProcessing: false });

// 👇 NOVA FUNÇÃO DE CANCELAMENTO DE CURSOS 👇
    const handleCancelarCompra = (course) => {
        setCancelModal({ isOpen: true, course: course, reason: '', customText: '', isProcessing: false });
    };

   const executeCancelCourse = async () => {
        const { course, reason, customText } = cancelModal;
        if (!reason) return showNotification("Por favor, selecione um motivo.", "warning");
        if (reason === 'Outro' && !customText.trim()) return showNotification("Por favor, digite o motivo.", "warning");

        setCancelModal(prev => ({ ...prev, isProcessing: true }));
        const isFree = parseFloat(String(course.price || 0)) <= 0;
        const motivoFinal = reason === 'Outro' ? customText : reason;

        try {
            if (showNotification) showNotification("Enviando solicitação de cancelamento...", "info");
    
            const validStatus = ["pago", "approved", "aprovado", "liberado", "concluido", "concluído"];
            let qTrans = query(collection(db, "transactions"), where("userEmail", "==", user.email), where("courseId", "==", course.id), where("status", "in", validStatus));
            let transSnap = await getDocs(qTrans);
    
            if (transSnap.empty) {
                const courseTitle = course.title || course.titulo;
                qTrans = query(collection(db, "transactions"), where("userEmail", "==", user.email), where("courseTitle", "==", courseTitle), where("status", "in", validStatus));
                transSnap = await getDocs(qTrans);
            }

            if (transSnap.empty) {
                qTrans = query(collection(db, "transactions"), where("userEmail", "==", user.email), where("courseId", "==", course.id));
                transSnap = await getDocs(qTrans);
            }
    
            if (!transSnap.empty) {
                // ATUALIZADO: Agora apenas envia o pedido para o painel Admin e bloqueia o acesso
                for (let docSnap of transSnap.docs) {
                    await updateDoc(doc(db, "transactions", docSnap.id), {
                        status: 'solicitado_cancelamento',
                        cancelReason: motivoFinal, // Envia o motivo para o seu painel
                        updatedAt: serverTimestamp()
                    });
                }
        
                if (setPurchasedIds) setPurchasedIds(prev => prev.filter(id => id !== course.id));
                if (showNotification) showNotification("Solicitação enviada! O administrador avaliará em breve.", "success");

                // Envio de Email
                const platformName = settings?.siteName || "Nossa Plataforma";
                const logoUrl = settings?.siteLogoUrl || settings?.logoUrl || ""; 
                const capaDoCurso = course.cover || course.thumbnailUrl || "https://images.unsplash.com/photo-1616469829941-c7200edec809?q=80&w=600";
                const nomeDoCurso = course.title || course.titulo || 'Curso';
                const precoFinal = isFree ? "0,00" : parseFloat(course.price || 0).toFixed(2).replace('.', ',');

                const cancelCourseBodyHTML = `
                    <div style="background-color:#f8fafc;padding:40px 20px;font-family:sans-serif;">
                        <div style="max-width:600px;margin:0 auto;background-color:#ffffff;padding:40px;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,0.05);color:#1e293b;">
                            ${logoUrl ? `<div style="text-align: center; margin-bottom: 30px;"><img src="${logoUrl}" alt="${platformName}" style="max-height: 70px; max-width: 200px; object-fit: contain;"></div>` : ''}
                            <div style="text-align: center; margin-bottom: 20px;">
                                <h2 style="color: #f59e0b; margin: 0; font-size: 24px;">Solicitação de Cancelamento Recebida</h2>
                            </div>
                            <p style="font-size:16px;">Olá, <strong>${user.displayName || 'Aluno'}</strong>.</p>
                            <p style="font-size:16px;line-height:1.6;">Recebemos o seu pedido de cancelamento para o curso na ${platformName}.</p>
                            <div style="text-align:center;margin:30px 0;">
                                <img src="${capaDoCurso}" style="max-width:100%;max-height:250px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);" alt="Capa">
                            </div>
                            <div style="background-color:#fffbeb;padding:20px;border-radius:12px;margin-top:20px;border:1px solid #fde68a;">
                                <p style="margin:0 0 10px 0;font-size:14px;color:#b45309;">Curso: <strong style="color:#92400e;">${nomeDoCurso}</strong></p>
                                <p style="margin:0 0 10px 0;font-size:14px;color:#b45309;">Motivo: <strong style="color:#92400e;">${motivoFinal}</strong></p>
                                <p style="margin:0;font-size:14px;color:#b45309;">Valor a ser estornado: <strong style="color:#f59e0b;">R$ ${precoFinal}</strong></p>
                            </div>
                            <p style="font-size:14px;line-height:1.6;margin-top:20px;color:#64748b;">Nossa equipe analisará sua solicitação e o estorno será processado em breve de acordo com as políticas do sistema de pagamento.</p>
                        </div>
                    </div>
                `;

                fetch("https://script.google.com/macros/s/AKfycbzyuxuOw0fx5YiAWuE_PaN8JE9VrupAStYQfKk6fFDMiLMn7BARtbLagoF3sPbhg9A/exec", {
                    method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ type: "transactional", to: user.email, subject: `Solicitação de Cancelamento: ${nomeDoCurso}`, body: cancelCourseBodyHTML, senderName: `Suporte ${platformName}` })
                }).catch(e => console.log(e));

            } else {
                if (showNotification) showNotification("Registro de compra original não encontrado no sistema.", "error");
            }
        } catch (error) {
            console.error("Erro geral no cancelamento:", error);
            if (showNotification) showNotification("Houve um erro técnico ao processar a solicitação.", "error");
        } finally {
            setCancelModal({ isOpen: false, course: null, reason: '', customText: '', isProcessing: false });
        }
    };
    // 👆 FIM DA NOVA FUNÇÃO 👆

    return (
        <div className="space-y-4 md:space-y-10 animate-fade-in max-w-[100rem] mx-auto mt-16 md:mt-28 mb-10 px-3 md:px-8 lg:px-12 font-sans">
            
            {/* HEADER */}
            <div className="flex items-center gap-2 md:gap-5 mb-3 md:mb-8 px-1">
                <div className="p-2 md:p-5 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-lg md:rounded-2xl shadow-inner">
                    <BookOpen className="w-5 h-5 md:w-8 md:h-8" />
                </div>
                <div>
                    <h2 className="text-xl md:text-4xl font-black text-slate-800 dark:text-white tracking-tight">Meus Cursos</h2>
                    <p className="text-slate-500 dark:text-slate-400 text-[10px] md:text-base mt-0.5 md:mt-1.5">Acesse os conteúdos que você já desbloqueou.</p>
                </div>
            </div>

            {/* CONTEÚDO (MENSAGEM VAZIA OU GRADE DE CURSOS) */}
            {myCourses.length === 0 ? (
                <div className="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl md:rounded-3xl p-8 md:p-16 flex flex-col items-center justify-center text-center bg-slate-50/50 dark:bg-slate-900/50 min-h-[200px] md:min-h-[300px]">
                    <div className="w-12 h-12 md:w-20 md:h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-400 mb-3 md:mb-6 shadow-inner">
                        <BookOpen className="w-6 h-6 md:w-10 md:h-10" />
                    </div>
                    <h4 className="font-extrabold text-base md:text-2xl text-slate-700 dark:text-slate-200 mb-1.5 md:mb-3">Nenhum curso liberado</h4>
                    <p className="text-slate-500 text-xs md:text-base max-w-sm md:max-w-lg leading-relaxed">Você ainda não adquiriu nenhum curso. Visite a aba "Portais" ou a "Loja de Recompensas" para iniciar sua jornada.</p>
                    
                    <button onClick={() => onSelectCourse(null)} className="mt-6 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg transition-colors">
                        Explorar Portais
                    </button>
                </div>
            ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-8">
                    {myCourses.map(course => (
                        <div 
                            key={course.id} 
                            className="group relative w-full aspect-[2/3] rounded-md md:rounded-2xl overflow-hidden cursor-pointer border border-white/10 bg-[#0a0a0f] transition-all shadow-lg hover:shadow-[0_15px_30px_rgba(79,70,229,0.3)] md:hover:-translate-y-1 select-none"

// =================================================================================
    // STUDENT DASHBOARD (OTIMIZADO PARA MOBILE COM BOTTOM BAR TIPO APP)
    // =================================================================================
    const StudentDashboard = ({ user, onLogout, settings, certificates = [], promotions = [] }) => { // <-- ADICIONADO PROMOTIONS
        const [isSidebarOpen, setIsSidebarOpen] = useState(false);
        const mobileSidebarRef = useRef(null), mobileMenuButtonRef = useRef(null);
        useEffect(() => {
            const query = window.matchMedia('(max-width: 1023px)');
            const update = () => {
                if (mobileSidebarRef.current) mobileSidebarRef.current.inert = query.matches && !isSidebarOpen;
                if (!query.matches) setIsSidebarOpen(false);
            };
            update(); query.addEventListener('change', update);
            const key = e => {
                if (!isSidebarOpen || !query.matches) return;
                if (e.key === 'Escape') { setIsSidebarOpen(false); mobileMenuButtonRef.current?.focus(); }
                if (e.key === 'Tab') {
                    const nodes = [...(mobileSidebarRef.current?.querySelectorAll('button:not([disabled]),a[href],input,select,[tabindex="0"]') || [])].filter(n => n.getClientRects().length);
                    const first = nodes[0], last = nodes[nodes.length - 1];
                    if (!first) return;
                    if (e.shiftKey && (document.activeElement === first || !mobileSidebarRef.current.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && (document.activeElement === last || !mobileSidebarRef.current.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
                }
            };
            document.addEventListener('keydown', key);
            if (isSidebarOpen && query.matches) mobileSidebarRef.current?.querySelector('button')?.focus();
            return () => { query.removeEventListener('change', update); document.removeEventListener('keydown', key); };
        }, [isSidebarOpen]);
        const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
        const [installState, setInstallState] = useState(() => window.platformAppInstalled?.() ? 'installed' : window.deferredPrompt ? 'ready' : 'waiting');
        const [installMessage, setInstallMessage] = useState('');
        const installBusy = useRef(false);
        useEffect(() => {
            const update = () => setInstallState(window.platformPwaInstalledThisSession || window.platformAppInstalled?.() ? 'installed' : window.deferredPrompt ? 'ready' : 'waiting');
            const displayMode = window.matchMedia('(display-mode: standalone)');
            window.addEventListener('platform-pwa-state', update); displayMode.addEventListener('change', update); update();
            return () => { window.removeEventListener('platform-pwa-state', update); displayMode.removeEventListener('change', update); };
        }, []);
        const handleInstallApp = async () => {
            if (installBusy.current || installState === 'installed') return;
            setInstallMessage('');
            const promptEvent = window.deferredPrompt;
            if (!promptEvent) {
                const apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                setInstallMessage(apple ? 'O iPhone/iPad não permite abrir a instalação por um botão do site.' : !window.isSecureContext ? 'A instalação precisa do endereço HTTPS da plataforma.' : 'O navegador ainda não disponibilizou a instalação. O app pode já estar instalado ou este navegador não oferecer a solicitação direta.');
                return;
            }
            installBusy.current = true;
            window.deferredPrompt = null;
            setInstallState('prompting');
            try {
                await promptEvent.prompt();

      const generateCertificate = async (courseId, courseName, courseObj, progressInfo) => {
        const modelo = certificados.find(c => c.courseId === courseId);
        if (!modelo || !modelo.bgUrl) return showNotification("Erro: Modelo de certificado não encontrado.", "error");

        showNotification("Gerando arquivo de alta definição...", "info");
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = modelo.bgUrl;

        img.onload = async () => {
            let finalUser = user;
            try {
                if (typeof db !== 'undefined') {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if (docSnap.exists()) finalUser = { ...user, ...docSnap.data() };
                }
            } catch(e) {}

            canvas.width = img.width;
            canvas.height = img.height;
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.drawImage(img, 0, 0);

            if (modelo.fields && modelo.fields.length > 0) {
                const ratio = w / 1000; 
                
                // 1. IMAGENS (LOGOS/SELOS)
                const imageFields = modelo.fields.filter(f => f.type === 'image');
                for (let field of imageFields) {
                    if (!field.url) continue;
                    try {
                        const imgMacro = new Image();
                        imgMacro.crossOrigin = "Anonymous";
                        imgMacro.src = field.url;
                        await new Promise((resolve) => { imgMacro.onload = resolve; imgMacro.onerror = resolve; });
                        
                        let pxX = (parseFloat(field.x) / 100) * w;
                        let pxY = (parseFloat(field.y) / 100) * h;
                        let targetW = (parseFloat(field.width) || 150) * ratio;
                        let targetH = imgMacro.height * (targetW / imgMacro.width);
                        
                        ctx.save();
                        ctx.translate(pxX, pxY);
                        ctx.rotate((field.rotation || 0) * Math.PI / 180);
                        ctx.drawImage(imgMacro, -targetW / 2, -targetH / 2, targetW, targetH);
                        ctx.restore();
                    } catch(e) {}
                }

                // 2. LINHAS GEOMÉTRICAS (NOVO)
                const lineFields = modelo.fields.filter(f => f.type === 'line');
                for (let field of lineFields) {
                    const pxX = (parseFloat(field.x) / 100) * w;
                    const pxY = (parseFloat(field.y) / 100) * h;
                    const targetW = (parseFloat(field.width) || 300) * ratio;
                    const targetH = (parseFloat(field.height) || 2) * ratio;

                    ctx.save();
                    ctx.translate(pxX, pxY);
                    ctx.rotate((field.rotation || 0) * Math.PI / 180);
                    ctx.fillStyle = field.color || "#000000";
                    ctx.fillRect(-targetW / 2, -targetH / 2, targetW, targetH);
                    ctx.restore();
                }

                // 3. TEXTOS
                const textFields = modelo.fields.filter(f => f.type !== 'image' && f.type !== 'line');
                for (let field of textFields) {
                    let pxX = (parseFloat(field.x) / 100) * w;
                    let pxY = (parseFloat(field.y) / 100) * h;
                    const fontSizePx = (parseFloat(field.fontSize) || 30) * ratio;

                    let type = field.type || "";
                    let originalText = String(field.label || field.text || "");
                    let cleanText = originalText.toUpperCase().trim();

                    let isName = type.includes('studentName') || cleanText.includes("NOME DO ALUNO") || cleanText === "NOME" || cleanText.includes("MACRO_NOME");
                    let isCPF = type.includes('cpf') || cleanText.includes("CPF");
                    let isCourse = type.includes('courseName') || cleanText.includes("NOME DO CURSO");
                    let isDate = type.includes('date') || cleanText.includes("DATA");
                    let isSignature = type.includes('signature') || cleanText.includes("ASSINATURA");
                    let isDescription = type.includes('completionText') || cleanText.includes("TEXTO CONCLUS");
                    
                    let fontWeight = isSignature ? 'normal' : (field.fontWeight || 'bold');
                    let fontStyle = isSignature ? 'italic' : 'normal';
                    let fontFamily = isSignature ? "'Brush Script MT', 'Dancing Script', 'Great Vibes', cursive" : (field.fontFamily || 'Arial');
                    
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle"; 
                    ctx.fillStyle = field.color || "#000000";
                    ctx.globalCompositeOperation = "multiply"; 
                    ctx.globalAlpha = 0.92; 
                    ctx.shadowColor = field.color || "#000000"; 
                    ctx.shadowBlur = 1.5; 
                    
                    const alunoData = finalUser || user || {};
                    const nomeAluno = alunoData.name || alunoData.displayName || user.displayName || "Aluno";
                    const cpfStr = alunoData.cpf || "CPF não cadastrado";
                    const cName = courseName || "Curso sem título";
                    
                    let dateStr = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    if (progressInfo?.completedAt) {
                        const d = progressInfo.completedAt.seconds ? new Date(progressInfo.completedAt.seconds * 1000) : new Date(progressInfo.completedAt);
                        if (!isNaN(d.getTime())) dateStr = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    }

                    let textoFinal = originalText;
                    if (isName) textoFinal = nomeAluno;
                    else if (isCPF) textoFinal = `CPF: ${cpfStr}`;
                    else if (isCourse) textoFinal = cName;
                    else if (isDate) textoFinal = `Conclusão: ${dateStr}`;
                    else if (isSignature) textoFinal = nomeAluno; 
                    else if (isDescription) textoFinal = `Certificamos que o aluno(a) ${nomeAluno} concluiu com êxito o curso ${cName} no dia ${dateStr}.`;
                    else if (field.type === 'custom_macro') {
                        const macroName = field.label.trim();
                        textoFinal = courseObj && courseObj[macroName] ? courseObj[macroName] : (alunoData && alunoData[macroName] ? alunoData[macroName] : ""); 
                    } else if (field.type === 'fixedText' || field.type === 'customText') {
                        textoFinal = field.label;
                    }

                    if (!textoFinal || String(textoFinal).trim() === "") continue;

                    let maxAvailableWidth = Math.min(pxX, w - pxX) * 2 * 0.90; 

                    ctx.save();
                    ctx.translate(pxX, pxY);
                    ctx.rotate((field.rotation || 0) * Math.PI / 180);

                    if (isDescription || textoFinal.length > 50) {
                        ctx.font = `${fontStyle} ${fontWeight} ${fontSizePx}px ${fontFamily}`;
                        const words = textoFinal.split(' ');
                        let line = ''; const lines = [];

                        for(let n = 0; n < words.length; n++) {
                            const testLine = line + words[n] + ' ';
                            const metrics = ctx.measureText(testLine);
                            if (metrics.width > maxAvailableWidth && n > 0) { 
                                lines.push(line.trim()); line = words[n] + ' '; 
                            } else { line = testLine; }
                        }
                        lines.push(line.trim());
                        
                        let currentY = 0 - (((lines.length - 1) * (fontSizePx * 1.5)) / 2);
                        for(let i = 0; i < lines.length; i++) {
                            ctx.fillText(lines[i], 0, currentY);
                            currentY += (fontSizePx * 1.5);
                        }
                    } else {
                        let currentFontSize = fontSizePx;
                        ctx.font = `${fontStyle} ${fontWeight} ${currentFontSize}px ${fontFamily}`;
                        let metrics = ctx.measureText(textoFinal);
                        
                        while (metrics.width > maxAvailableWidth && currentFontSize > 10) {
                            currentFontSize -= 1;
                            ctx.font = `${fontStyle} ${fontWeight} ${currentFontSize}px ${fontFamily}`;
                            metrics = ctx.measureText(textoFinal);
                        }
                        ctx.fillText(textoFinal, 0, 0);
                    }
                    ctx.restore();
                }
                ctx.globalCompositeOperation = "source-over";
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }

            try {
                const dataUrl = canvas.toDataURL('image/jpeg', 1.0); 
                const link = document.createElement('a');
                link.download = `Certificado_${courseName.replace(/\s+/g, '_')}.jpg`;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification("Certificado baixado!", "success");
            } catch (err) {
                console.error(err);
            }
        };
    };

                                    if (cursoInfo && (cursoInfo.cover || cursoInfo.thumbnailUrl)) {
                                        capaDoCurso = cursoInfo.cover || cursoInfo.thumbnailUrl;
                                    }

                                    // Confirma o pagamento com o provedor antes de liberar a compra.
                                    if (!paymentId || transData.userId !== user.uid) throw new Error('Pagamento ainda não confirmado.');
                                    const approvalResponse = await fetch(`https://api.mercadopago.com/v1/payments/${encodeURIComponent(paymentId)}`, { headers: { Authorization: `Bearer ${currentSettings.mercadopagoAccessToken || currentSettings.mercadoPagoAccessToken || BACKUP_ACCESS_TOKEN}` } });
                                    const approvedPayment = await approvalResponse.json();
                                    if (!approvalResponse.ok || approvedPayment.status !== 'approved' || String(approvedPayment.external_reference) !== String(lastTransId) || Math.abs(Number(approvedPayment.transaction_amount) - Number(transData.valor)) > 0.01) throw new Error('Aguardando confirmação do pagamento.');
                                    await updateDoc(transRef, {
                                        paidAt: transData.paidAt || approvedPayment.date_approved || serverTimestamp(), 
                                        status: 'pago',
                                        mpPaymentId: paymentId || 'N/A', 
                                        updatedAt: serverTimestamp() 
                                    });
                                    
                                    if(showNotification) showNotification("Pagamento do curso confirmado com sucesso!", "success");
                                    
                                    // Atualiza a tela
                                    const qTrans = query(collection(db, "transactions"), where("userEmail", "==", user.email), where("status", "in", ["aprovado", "pago", "approved"]));
                                    const transSnapList = await getDocs(qTrans);
                                    setPurchasedIds(transSnapList.docs.map(d => d.data().courseId));

                                   // 👇 DISPARA O E-MAIL DE ACESSO LIBERADO (CURSO) 👇
                                    fetch("https://script.google.com/macros/s/AKfycbzyuxuOw0fx5YiAWuE_PaN8JE9VrupAStYQfKk6fFDMiLMn7BARtbLagoF3sPbhg9A/exec", {
                                        method: "POST",
                                        mode: "no-cors", 
                                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                                        body: JSON.stringify({
                                            to: user.email,
                                            userName: user.displayName || 'Aluno',
                                            itemName: nomeDoCurso,
                                            itemImage: capaDoCurso,
                                            itemType: "course",
                                            subject: "Seu Acesso foi Liberado!",
                                            titleHeader: "ACESSO LIBERADO",
                                            itemPrice: transData.valor || "0,00",
                                            message: `Parabéns, seu acesso ao curso "${nomeDoCurso}" foi liberado com sucesso! Você já pode iniciar sua jornada agora mesmo na plataforma.`
                                        })
                                    }).catch(e => console.log("E-mail Curso disparado: ", e));
                                }
                            }
                            
                            // Limpa o cache e remove os parâmetros feios da URL
                            localStorage.removeItem('last_transaction_id');
                            window.history.replaceState({}, document.title, window.location.pathname);
                            
                        } catch (e) { console.error("Erro ao aprovar curso:", e); }
                    }
                }

                // =========================================================
                // 3. VERIFICA COMPRA DO MARKETPLACE (LOJA DE PRODUTOS)
                // =========================================================
                if (mpOrderStatus === 'approved') {
                    const lastOrderId = localStorage.getItem('last_mp_order_id');
                    if (lastOrderId && db) {
                        try {
                            const orderRef = doc(db, "marketplace_orders", lastOrderId);
                            const orderSnap = await getDoc(orderRef);
                            
                            // 👇 LÊ O BANCO DA LOJA PRIMEIRO 👇
                            if(orderSnap.exists()) {
                                const orderData = orderSnap.data();
                                
                                // 👇 VERIFICA SE O PRODUTO AINDA É PENDENTE ANTES DE ENVIAR E-MAIL 👇
                                if (orderData.status !== 'pago' && orderData.status !== 'approved' && orderData.status !== 'liberado') {
                                    
                                    let nomeDoProduto = orderData.productTitle || "Seu Produto";
                                    let capaDoProduto = "https://images.unsplash.com/photo-1616469829941-c7200edec809?q=80&w=600";

                                    // BUSCA INFO ADICIONAL DO PRODUTO PARA O E-MAIL
                                    try {
                                        const prodSnap = await getDoc(doc(db, "marketplace_products", orderData.productId));
                                        if (prodSnap.exists()) {
                                            const pData = prodSnap.data();
                                            if (pData.images && pData.images.length > 0) capaDoProduto = pData.images[0];
                                            if (pData.title) nomeDoProduto = pData.title;
                                        }
                                    } catch(e){}

                                    // ATUALIZA NO BANCO COMO LIBERADO
                                    await updateDoc(orderRef, { 
                                        status: 'pago',
                                        mpPaymentId: paymentId || 'N/A', 
                                        updatedAt: serverTimestamp() 
                                    });
                                    
                                    if(showNotification) showNotification("Sua compra na Loja foi confirmada!", "success");

                                    // 👇 DISPARA O E-MAIL DE ACESSO LIBERADO (PRODUTO LOJA) 👇
                                    fetch("https://script.google.com/macros/s/AKfycbzyuxuOw0fx5YiAWuE_PaN8JE9VrupAStYQfKk6fFDMiLMn7BARtbLagoF3sPbhg9A/exec", {
                                        method: "POST",
                                        mode: "no-cors",
                                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                                        body: JSON.stringify({
                                            to: user.email,
                                            userName: user.displayName || 'Aluno',
                                            itemName: nomeDoProduto,
                                            itemImage: capaDoProduto,
                                            itemType: "product",
                                            subject: "Sua Compra foi Liberada!",
                                            titleHeader: "PRODUTO LIBERADO",
                                            itemPrice: orderData.valor || "0,00",
                                            message: `Olá, ${user.displayName || 'Aluno'}! Seu produto "${nomeDoProduto}" adquirido em nossa loja oficial já está disponível para acesso na sua área do aluno. O valor de R$ ${orderData.valor || '---'} foi confirmado.`
                                        })
                                    }).catch(e => console.log("E-mail Loja disparado: ", e));
                                }
                            }
                            
                            // Limpa o cache e remove os parâmetros feios da URL
                            localStorage.removeItem('last_mp_order_id');
                            window.history.replaceState({}, document.title, window.location.pathname);

                        } catch (e) { console.error("Erro ao aprovar produto:", e); }
                    }
                }
            };
            
            checkPaymentReturn();
        }, [user, db, allCourses]);

       useEffect(() => {
           if(!db || !user) return;
           const unsub = onSnapshot(doc(db, "support_chats", user.uid), (doc) => {
               if(doc.exists()) setUnreadCount(doc.data().unreadStudent || 0);
           });
           return () => unsub();
       }, [user]);

       const showNotification = (message, type = 'success') => { setNotification({ message, type }); setTimeout(() => setNotification(null), 3000); };

       useEffect(() => {
           if(!db || !user) return;
           const qProg = query(collection(db, "user_progress"), where("userId", "==", user.uid));
           const unsubProg = onSnapshot(qProg, snap => {
               const progMap = {};
               snap.forEach(doc => { progMap[doc.data().courseId] = doc.data(); });
               setUserProgress(progMap);
           });
           return () => unsubProg();
       }, [user]);
       
      useEffect(() => {
           if(!db || !user) return;

           let unsubCourses = () => {};
           let unsubTrans = () => {};

           const loadData = async () => {
               try {
                   // Correção de ampersand para evitar erro de Named Entity
                   const am = String.fromCharCode(38);
                   // 1. Cursos em Tempo Real
                   const qCourses = query(collection(db, "courses"), where("ativo", "==", true));
                   unsubCourses = onSnapshot(qCourses, (snap) => {
                       setAllCourses(snap.docs.map(d => ({id: d.id, ...d.data()})));
                   });
                   
                   // 2. Transações em Tempo Real (A MÁGICA DA LIBERAÇÃO IMEDIATA)
                   const qTrans = query(collection(db, "transactions"), where("userEmail", "==", user.email), where("status", "in", ["aprovado", "pago", "approved"]));
                   unsubTrans = onSnapshot(qTrans, (snap) => {
                       setPurchasedIds(snap.docs.map(d => d.data().courseId));
                   });

                   if(settings) setCurrentSettings(prev => ({...prev, ...settings}));
               } catch (error) { 
                   console.error("Erro ao carregar dados em tempo real:", error); 
               } finally { 
                   setLoadingData(false); 
               }
           };

           loadData();

           // Limpa os ouvintes quando o aluno sai da tela
           return () => {
               unsubCourses();
               unsubTrans();
           };
       }, [user, settings, db]);

       const handleSelectCourse = (course) => { setSelectedCourse(course); setView('course_details'); }; 
       const handleResumeCourse = (course, modIdx, lessonIdx) => { setSelectedCourse(course); setView('course_player'); };
       const handleStartCourse = async (courseToStart) => { 
    // Se o aluno não tem o curso, ele só pode ter chegado aqui se for GRATUITO.
    // Então, vamos matricular ele silenciosamente no banco de dados!
    if (!purchasedIds.includes(courseToStart.id)) {
        try {
            await addDoc(collection(db, "transactions"), {
                courseId: courseToStart.id,
                courseTitle: courseToStart.title || courseToStart.titulo || 'Curso Gratuito',
                userId: user.uid,
                userName: user.displayName || 'Aluno',
                userEmail: user.email,
                valor: 0,
                status: 'pago', // Marca como pago para o sistema liberar o acesso permanentemente
                method: 'free_enrollment',
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });
            
            // Atualiza os cursos que ele tem no mesmo segundo
            setPurchasedIds(prev => [...prev, courseToStart.id]);
            if (showNotification) showNotification("Curso gratuito adicionado aos seus portais!", "success");

            // 👇 DISPARO DE E-MAIL (CURSO GRÁTIS) 👇
            let capaDoCurso = courseToStart.cover || courseToStart.thumbnailUrl || "https://images.unsplash.com/photo-1616469829941-c7200edec809?q=80&w=600";
            fetch("https://script.google.com/macros/s/AKfycbzyuxuOw0fx5YiAWuE_PaN8JE9VrupAStYQfKk6fFDMiLMn7BARtbLagoF3sPbhg9A/exec", {
                method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    to: user.email,
                    userName: user.displayName || 'Aluno',
                    itemName: courseToStart.title || courseToStart.titulo || 'Curso Gratuito',
                    itemImage: capaDoCurso,
                    itemType: "course", // MUDADO PARA COURSE PARA LIBERAR ACESSO
                    subject: "Seu Novo Curso Gratuito foi Liberado!",
                    titleHeader: "ACESSO GRATUITO LIBERADO",
                    message: `Olá! Seu acesso ao curso gratuito "${courseToStart.title || courseToStart.titulo}" foi liberado com sucesso. Aproveite os estudos!`
                })
            }).catch(e => console.log("Erro no e-mail grátis: ", e));
            // 👆 FIM DO DISPARO 👇

        } catch (err) {
            console.error("Erro ao matricular no curso gratuito:", err);
        }
    }
    setView('course_player'); 
};
       const handlePurchaseSuccess = (courseId) => { setPurchasedIds(prev => [...prev, courseId]); setCheckoutCourse(null); showNotification("Acesso Liberado!", "success"); };
       
       const myCoursesList = allCourses.filter(c => purchasedIds.includes(c.id));

        // =======================================================================
        // ⚡ LÓGICA DE DEEP LINKING: LER ID DA URL E FILTRAR CONTEÚDO
        // =======================================================================
        useEffect(() => {
            if (!loadingData && allCourses.length > 0) {
                const params = new URLSearchParams(window.location.search);
                const courseId = params.get('id');
                if (params.get('product')) setView('loja');
                
                if (courseId) {
                    const found = allCourses.find(c => c.id === courseId);
                    if (found) {
                        setSelectedCourse(found);
                        // Se já comprou, vai direto pro player. Se não, abre detalhes.
                        if (purchasedIds.includes(courseId)) {
                            setView('course_player');
                        } else {
                            setView('course_details');
                        }
                        // Limpa o parâmetro da URL de forma elegante sem recarregar
                        const newUrl = window.location.pathname;
                        window.history.replaceState({}, document.title, newUrl);
                    }
                }
            }
        }, [loadingData, allCourses, purchasedIds]);

        useEffect(() => {
            // 👇 ISSO AVISA A IA GLOBAL ONDE ESTAMOS 👇
           window.AemCurrentView = view;
           
           const fab = document.getElementById('aem-chat-fab');
           if (fab) {
               if (view === 'home') {
                   fab.style.display = 'none';
                   if (window.AemIaWidget && window.AemIaWidget.closeWidget) {
                       window.AemIaWidget.closeWidget();
                   }
               } else {
                   fab.style.display = 'flex';
               }
           }
       }, [view]);
       if (loadingData) return <div className="h-screen flex items-center justify-center cosmic-bg"><div className="w-16 h-16 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div></div>;

       // 👇 COLE ESSE CÓDIGO NOVO NO LUGAR (A PARTIR DAQUI) 👇
       

        return (
            <div className="platform-student-shell flex h-screen overflow-hidden text-white font-sans spiritual-bg relative">
                
                {/* Modais Globais Mantidos */}
                {confirmDialog.isOpen && (
                    <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                        <div className="bg-[#111] border border-[#333] rounded-3xl shadow-2xl p-6 md:p-8 max-w-sm w-full text-center animate-scale-in">
                            <div className="w-16 h-16 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-5 shadow-[0_0_20px_rgba(245,158,11,0.2)]">
                                <Star size={32} fill="currentColor" />
                            </div>
                            <h3 className="text-xl md:text-2xl font-bold text-white mb-2">{confirmDialog.title}</h3>
                            <p className="text-sm text-gray-400 mb-8 leading-relaxed">{confirmDialog.message}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmDialog({ ...confirmDialog, isOpen: false })} className="flex-1 py-3.5 rounded-xl bg-[#222] text-white font-bold hover:bg-[#333] transition-colors text-sm">
                                    Cancelar
                                </button>
                                <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog({ ...confirmDialog, isOpen: false }); }} className="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold shadow-lg shadow-amber-500/20 transition-transform active:scale-95 text-sm">
                                    {confirmDialog.btnText}
                                </button>
                            </div>
                        </div>

                        {notification.type === 'error' ? <AlertCircle size={20} /> : <CheckCircle size={20} />}

                    </div>

                {checkoutCourse && <CheckoutModal course={checkoutCourse} user={updatedUser} onClose={() => setCheckoutCourse(null)} onSuccess={handlePurchaseSuccess} settings={currentSettings} showNotification={showNotification} />}
                
                {/* Fundo escuro mobile quando menu está aberto */}
                {isSidebarOpen && (
                    <div className="fixed inset-0 bg-black/60 z-40 lg:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>
                )}

               {/* ========================================== */}
                {/* NOVO MENU LATERAL (SIDEBAR CORRIGIDA)        */}
                {/* ========================================== */}
                <aside id="platform-student-sidebar" ref={mobileSidebarRef} aria-label="Navegação do aluno" className={`platform-student-sidebar fixed inset-y-0 left-0 z-50 glass-panel border-r border-white/10 flex flex-col transition-all duration-300 lg:relative lg:translate-x-0 ${isSidebarOpen ? 'translate-x-0 w-64' : '-translate-x-full w-64'} ${isSidebarCollapsed ? 'lg:w-20' : 'lg:w-64'}`}>
                    
                    {/* Logo Sidebar */}
                    <div className={`h-[80px] flex items-center border-b border-white/10 shrink-0 cursor-pointer transition-all ${isSidebarCollapsed ? 'lg:justify-center lg:px-0 px-6' : 'px-6'}`} onClick={() => { setView('catalog'); setIsSidebarOpen(false); }}>
                        <div className="flex items-center gap-3 overflow-hidden w-full">
                            {settings?.siteLogoUrl || settings?.logoUrl ? (
                                <img src={settings?.siteLogoUrl || settings?.logoUrl} alt="Logo" className="h-8 w-auto object-contain rounded-md drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] shrink-0" />
                            ) : (
                                <div className="w-8 h-8 bg-gradient-to-br from-purple-600 to-indigo-900 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(147,51,234,0.5)] border border-white/20 shrink-0">
                                    <span className="font-black text-sm">{(settings?.siteName || "P").charAt(0)}</span>
                                </div>
                            )}
                            <span className={`text-white tracking-[0.2em] text-[12px] uppercase font-medium truncate animate-fade-in flex-1 ${isSidebarCollapsed ? 'lg:hidden block' : 'block'}`} style={{ fontFamily: `"${settings?.siteNameFont || 'Montserrat'}", sans-serif` }}>
                                {settings?.siteName || "Portal"}

                            <X size={20} />
                        </button>

                                <div className="w-full h-full rounded-full bg-[#05050A] overflow-hidden flex items-center justify-center">
                                    {realProfile.photo ? (

                                        <span className="font-bold text-purple-300 text-sm">{realProfile.name.charAt(0)}</span>
                                    )}
                                </div>
                            </div>
                            <div className={`flex-1 min-w-0 animate-fade-in ${isSidebarCollapsed ? 'lg:hidden block' : 'block'}`}>
                                <p className="text-xs text-white/50 group-hover:text-purple-300 transition-colors">Ver Perfil</p>
                                <p className="text-sm font-bold text-white truncate">{realProfile.name.split(' ')[0]}</p>
                            </div>
                        </div>
                    </div>

                    {/* Menu de Navegação Sidebar */}
                    <nav className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">

                                        isActive 
                                        ? 'bg-white/10 text-white shadow-[0_0_20px_rgba(168,85,247,0.3)] border border-purple-500/40' 
                                        : 'text-white/60 hover:text-white hover:bg-white/5 border border-transparent'
                                    }`}
                                >
                                    <item.icon size={20} className={`${isActive ? 'text-purple-400' : 'group-hover:text-purple-300'} transition-colors shrink-0`} />
                                    
                                    <span className={`tracking-wide truncate animate-fade-in text-left ${isSidebarCollapsed ? 'lg:hidden block' : 'block'}`}>
                                        {item.label}

                                            {item.badge}
                                        </span>

                                    {/* Bolinha vermelha de notificação quando o menu está fechado */}
                                    {item.badge > 0 && (
                                        <span className={`absolute top-2 right-2 w-2.5 h-2.5 bg-purple-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(147,51,234,0.8)] ${isSidebarCollapsed ? 'hidden lg:block' : 'hidden'}`}></span>

                                </button>
                            );
                        })}
                    </nav>

                    {/* Footer Sidebar (Logout) */}
                    <div className="p-4 border-t border-white/10 shrink-0">

                            <Download size={18} className="shrink-0"/>
                            <span className={isSidebarCollapsed ? 'lg:hidden block' : 'block'}>{installState === 'installed' ? 'Aplicativo instalado' : installState === 'prompting' ? 'Instalando…' : 'Instalar aplicativo'}</span>
                        </button>
                        {installMessage && <p role="status" className="text-xs text-indigo-200 mb-3 leading-relaxed">{installMessage}</p>}
                        <button onClick={onLogout} title={isSidebarCollapsed ? "Sair" : ""} className={`w-full py-3 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500/20 hover:text-red-300 transition-colors flex items-center text-sm font-bold border border-red-500/20 ${isSidebarCollapsed ? 'lg:justify-center lg:px-0 px-4 gap-2' : 'justify-center gap-2 px-4'}`}>
                            <LogOut size={18} className="shrink-0" /> 
                            <span className={`animate-fade-in ${isSidebarCollapsed ? 'lg:hidden block' : 'block'}`}>Sair da Conta</span>
                        </button>


                    </div>
                </aside>

                {/* ========================================== */}
                {/* ÁREA PRINCIPAL DA DIREITA                  */}
                {/* ========================================== */}
                <div className="platform-student-body flex-1 min-w-0 flex flex-col h-screen overflow-hidden relative bg-transparent">
                    
                    {/* HEADER SUPERIOR (Mobile + Pontos/Sino + Botão de Recolher PC) */}
                    <header className="h-[65px] md:h-[80px] glass-panel border-b border-white/10 flex items-center justify-between px-4 md:px-8 shrink-0 z-30 shadow-md transition-all duration-300">

                            {/* Botão Mobile */}
                            <button ref={mobileMenuButtonRef} aria-label="Abrir menu" aria-controls="platform-student-sidebar" aria-expanded={isSidebarOpen} onClick={() => setIsSidebarOpen(true)} className="lg:hidden p-2 text-white/70 hover:text-white bg-white/5 rounded-lg border border-white/10 transition-colors">
                                <Menu size={20} />
                            </button>
