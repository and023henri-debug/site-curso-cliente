                                                            className="w-full text-right text-lg sm:text-xl font-serif italic text-slate-600 bg-transparent border-b border-slate-300 focus:border-indigo-500 outline-none pb-1 placeholder-slate-400"
                                                        />
                                                    </div>
                                                </div>

                                                <div className="absolute bottom-6 right-8 hidden sm:flex items-center gap-4 z-20">
                                                    <span className="text-xs font-bold font-mono text-slate-400">Pág. {activeLessonIndex + 1}</span>
                                                    <button onClick={() => turnPage('next')} className="hover:text-amber-600 transition-colors text-slate-400 bg-white/80 backdrop-blur-md shadow-lg p-2.5 rounded-full border border-slate-300 transition-all hover:scale-110 active:scale-95"><ArrowRight size={16}/></button>
                                                </div>
                                                
                                                {/* Controles Mobile */}
                                                <div className="flex justify-between items-center mt-4 sm:hidden pt-4 border-t border-slate-200 z-20 relative">
                                                    <button onClick={() => turnPage('prev')} disabled={activeModuleIndex === 0 && activeLessonIndex === 0} className="p-3 bg-white shadow-md border border-slate-200 rounded-full text-slate-600 disabled:opacity-30"><ArrowLeft size={16}/></button>
                                                    <button onClick={() => turnPage('next')} className="p-3 bg-white shadow-md border border-slate-200 rounded-full text-slate-600"><ArrowRight size={16}/></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                            {/* 👆 FIM DA INTERFACE DO LIVRO AVANÇADO 👆 */}

                            {/* 👇 NOVA ABA DE TRANSCRIÇÃO POR IA (WHISPER LOCAL) 👇 */}

                                <div className="animate-fade-in space-y-6">
                                    {embedUrl?.includes('youtube.com') ? <YouTubeTabTranscription key={embedUrl} controller={youtubeController} stopRef={stopTabTranscription} modelRef={transcriberRef} onActive={setIsTranscribing} onText={text => { setTranscriptionText(text); setStreamingWords(text.split(/\s+/).filter(Boolean)); setAiSummary(''); }} /> : (
                                    <div className="bg-gradient-to-br from-[#0a0a15] to-[#050505] border border-white/10 rounded-[2.5rem] p-8 md:p-12 flex flex-col items-center text-center relative overflow-hidden shadow-2xl">
                                        
                                        {/* Barra de Progresso do Download do Modelo */}
                                        {isTranscribing && (
                                            <div className="absolute top-0 left-0 w-full h-1.5 bg-white/5">
                                                <div className="h-full bg-indigo-500 transition-all duration-300 shadow-[0_0_15px_#6366f1]" style={{ width: `${transcriptionProgress}%` }}></div>
                                            </div>
                                        )}

                                        <div className={`w-28 h-28 rounded-[2rem] flex items-center justify-center mb-8 transition-all duration-1000 ${isTranscribing ? 'bg-indigo-600 rotate-[360deg] shadow-[0_0_50px_rgba(99,102,241,0.5)]' : 'bg-white/5 border border-white/10'}`}>
                                            {isTranscribing ? <Zap size={48} className="text-white animate-pulse"/> : <Mic size={48} className="text-indigo-400"/>}
                                        </div>

                                        <h3 className="text-3xl font-black text-white mb-3">Transcrição Avançada</h3>
                                        <p className="text-slate-400 text-sm max-w-md mb-10 leading-relaxed">
                                            O nosso sistema utiliza inteligência artificial de última geração para processar o áudio do vídeo e entregar uma transcrição precisa, limpa e organizada em tempo recorde.
                                        </p>

                                        <div className="flex flex-col items-center gap-4">
                                            <button 
                                                onClick={async () => {
                                                    if (isTranscribing) return;
                                                    setIsTranscribing(true);
                                                    setStreamingWords([]);
                                                    setTranscriptionText('');
                                                    setAiSummary('');
                                                    setTranscriptionProgress(0);
                                                    
                                                    try {
                                                        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                                                        const modelName = isMobile ? 'Xenova/whisper-tiny' : 'Xenova/whisper-base';
                                                        
                                                        setStatusText('Otimizando: Extraindo áudio de alta fidelidade...');
                                                        await new Promise(r => setTimeout(r, 100)); // Breather para UI
                                                        
                                                        // PASSO 1: EXTRAIR ÁUDIO A 16KHZ MONO (PADRÃO WHISPER)
                                                        const videoResponse = await fetch(fixUrl(currentLesson.conteudo));
                                                        const videoBlob = await videoResponse.blob();
                                                        
                                                        // Trava de segurança para mobile para evitar crash por falta de RAM
                                                        if (isMobile && videoBlob.size > 80 * 1024 * 1024) {
                                                            throw new Error("Vídeo muito longo para processar no telemóvel. Por favor, use um computador.");
                                                        }

                                                        const arrayBuffer = await videoBlob.arrayBuffer();
                                                        
                                                        // Usamos um contexto de áudio limpo para evitar artefatos
                                                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                                                        let audioBuffer;
                                                        try {
                                                            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                                                        } catch (e) {
                                                            throw new Error("O telemóvel ficou sem memória para processar este vídeo.");
                                                        }
                                                        
                                                        // Garantimos o merge de canais para evitar duplicação de áudio espacial
                                                        let audioData = audioBuffer.getChannelData(0);
                                                        if (audioBuffer.numberOfChannels > 1) {
                                                            const channel2 = audioBuffer.getChannelData(1);
                                                            for (let i = 0; i < audioData.length; i++) {
                                                                audioData[i] = (audioData[i] + channel2[i]) / 2;
                                                            }
                                                        }
                                                        
                                                        // Fecha o contexto para libertar memória imediatamente
                                                        audioCtx.close();
                                                        setTranscriptionProgress(20);
                                                        await new Promise(r => setTimeout(r, 100));

                                                        // PASSO 2: CARREGAR MODELO (OTIMIZADO PARA DISPOSITIVO)
                                                        if (!transcriberRef.current) {
                                                            setStatusText(isMobile ? 'Iniciando Motor de Voz Ultra-Leve...' : 'Calibrando Motor de Voz Premium...');
                                                            await new Promise(r => setTimeout(r, 50));

                                                            transcriberRef.current = await pipeline('automatic-speech-recognition', modelName, {
                                                                progress_callback: (data) => {
                                                                    if (data.status === 'progress') {
                                                                        setTranscriptionProgress(20 + (data.progress * 0.5));
                                                                    }
                                                                }
                                                            });
                                                        }

                                                        setStatusText('Analizando fonemas e sotaques...');
                                                        setTranscriptionProgress(70);

                                                        // PASSO 3: TRANSCREVER COM PARÂMETROS DE ALTA PRECISÃO
                                                        const output = await transcriberRef.current(audioData, {
                                                            language: 'portuguese',
                                                            task: 'transcribe',
                                                            chunk_length_s: 30,
                                                            stride_length_s: 5,
                                                            return_timestamps: false,
                                                            repetition_penalty: 1.2
                                                        });

                                                        let rawText = output.text.replace(/\s+/g, ' ').trim();
                                                        if (!rawText || rawText.length < 3) throw new Error("Não detectamos fala legível.");

                                                        // PASSO 4: POLIMENTO CIRÚRGICO POR IA (INJEÇÃO DE CONTEXTO BIOMÉTRICO)
                                                        setStatusText('Refinando nomes e gramática...');
                                                        setTranscriptionProgress(90);
                                                        
                                                        const prompt = `PRECISÃO MÁXIMA DE TRANSCRIÇÃO: O texto abaixo é uma transcrição bruta.
                                                        Contexto do Aluno: ${user.displayName}. 
                                                        Instruções Imperativas:
                                                        1. CORRIJA NOMES PRÓPRIOS: Identifique fonemas de nomes brasileiros e corrija para a grafia correta (Ex: se ouvir algo como "Estefani Rolim", corrija para "Stephanie Rolim" obrigatoriamente).
                                                        2. LIMPEZA TÉCNICA: Remova hesitações (hã, é, né, tipo) e repetições acidentais.
                                                        3. PONTUAÇÃO: Adicione vírgulas e pontos para tornar a leitura profissional e fluida.
                                                        4. FIDELIDADE: Mantenha todas as palavras de conteúdo, apenas corrija a grafia e estrutura.
                                                        
                                                        RETORNE APENAS O TEXTO FINAL POLIDO:\n\n${rawText}`;
                                                        
                                                        const aiRes = await fetch("https://meu-backend-ia.vercel.app/api/chat", {
                                                            method: "POST", headers: { "Content-Type": "application/json" },
                                                            body: JSON.stringify({ message: prompt })
                                                        });
                                                        const aiData = await aiRes.json();
                                                        const fullText = aiData.reply || rawText;

                                                        setTranscriptionProgress(100);
                                                        setStatusText('Transcrição Impecável Finalizada!');
                                                        showNotification("Transcrição concluída com precisão máxima!", "success");

                                                        // PASSO 5: STREAMING ULTRA RÁPIDO
                                                        const words = fullText.split(' ').filter(w => w.length > 0);
                                                        for (let i = 0; i < words.length; i++) {
                                                            setStreamingWords(prev => [...prev, words[i]]);
                                                            await new Promise(r => setTimeout(r, 35)); 
                                                        }

                                                        setTranscriptionText(fullText);
                                                    } catch (err) {
                                                        console.error("Whisper Error:", err);
                                                        showNotification(err.message || "Erro ao transcrever arquivo.", "error");
                                                        setStatusText('Falha no motor de voz.');
                                                    } finally {
                                                        setIsTranscribing(false);
                                                    }
                                                }}
                                                disabled={isTranscribing}
                                                className={`px-12 py-5 rounded-2xl font-black uppercase tracking-[0.2em] transition-all flex items-center gap-3 shadow-2xl ${isTranscribing ? 'bg-slate-800 text-slate-500 cursor-wait' : 'bg-indigo-600 hover:bg-indigo-500 text-white hover:scale-105 active:scale-95'}`}
                                            >
                                                {isTranscribing ? <div className="w-5 h-5 border-2 border-slate-500 border-t-white rounded-full animate-spin"></div> : <Zap size={20} fill="currentColor"/>}
                                                {isTranscribing ? "A Processar..." : "Transcrever Vídeo"}
                                            </button>
                                            
                                            {isTranscribing && <p className="text-indigo-400 text-[10px] font-bold uppercase tracking-[0.2em] animate-pulse">{statusText}</p>}
                                        </div>
                                    </div>

                                    )}

                                    {/* ÁREA DE VISUALIZAÇÃO DAS PALAVRAS EM FLUXO */}
                                    {(streamingWords.length > 0 || transcriptionText) && (
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fade-in pb-20">
                                            <div className="bg-[#050505] border border-white/10 rounded-[2.5rem] p-8 flex flex-col min-h-[400px] shadow-2xl relative overflow-hidden">
                                                <div className="flex justify-between items-center mb-8">
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-3 h-3 rounded-full ${isTranscribing ? 'bg-indigo-500 animate-pulse' : 'bg-emerald-500'}`}></div>
                                                        <h4 className="text-white font-bold uppercase text-xs tracking-widest">Texto Extraído</h4>
                                                    </div>
                                                    <button onClick={() => { navigator.clipboard.writeText(streamingWords.join(' ')); showNotification("Copiado!"); }} className="p-2 bg-white/5 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all"><Copy size={18}/></button>
                                                </div>
                                                <div className="flex-1 text-slate-300 text-xl leading-relaxed font-medium">
                                                    {streamingWords.map((word, i) => (
                                                        <span key={i} className="inline-block mr-2 animate-fade-in text-white/90">
                                                            {word}
                                                        </span>
                                                    ))}
                                                    {isTranscribing && <span className="inline-block w-2 h-6 bg-indigo-500 animate-pulse ml-1 align-middle"></span>}
                                                </div>
                                            </div>

                                            <div className="bg-gradient-to-br from-indigo-900/20 to-purple-900/10 border border-indigo-500/30 rounded-[2.5rem] p-8 md:p-10 relative overflow-hidden flex flex-col shadow-2xl">
                                                <div className="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-8">
                                                    <div className="flex items-center gap-3">
                                                        <div className="p-2 bg-indigo-500/20 rounded-lg text-indigo-400"><Sparkles size={20}/></div>
                                                        <h4 className="text-white font-black uppercase text-sm tracking-[0.1em]">Resumo Inteligente</h4>
                                                    </div>
                                                    
                                                    {transcriptionText && (
                                                        <div className="flex flex-wrap gap-2">
                                                            {!aiSummary ? (
                                                                <button 
                                                                    onClick={async () => {
                                                                        setIsSummarizing(true);
                                                                        try {
                                                                            const prompt = `Aja como um Professor Acadêmico de alto nível. Analise o texto abaixo e gere um resumo NÍVEL UNIVERSITÁRIO. 
                                                                            REGRAS: 
                                                                            1. Use títulos em CAIXA ALTA para separar seções. 
                                                                            2. Use emojis coloridos (🔵, 🟢, 🔴) como marcadores para criar um efeito visual de cores.
                                                                            3. Utilize vocabulário técnico e preciso.
                                                                            4. Estruture com Introdução Conceitual, Pontos de Análise e Síntese Executiva.
                                                                            TEXTO:\n\n${transcriptionText}`;
                                                                            
                                                                            const response = await fetch("https://meu-backend-ia.vercel.app/api/chat", {
                                                                                method: "POST", headers: { "Content-Type": "application/json" },
                                                                                body: JSON.stringify({ message: prompt })
                                                                            });
                                                                            const data = await response.json();
                                                                            setAiSummary(data.reply);
                                                                        } catch(e) { showNotification("Erro ao processar resumo.", "error"); }
                                                                        finally { setIsSummarizing(false); }
                                                                    }}
                                                                    disabled={isSummarizing}
                                                                    className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center gap-2 shadow-lg shadow-indigo-600/30"
                                                                >
                                                                    {isSummarizing ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : <Zap size={16}/>}
                                                                    Gerar com IA
                                                                </button>
                                                            ) : (
                                                                /* 👇 NOVAS OPÇÕES DE REFINAMENTO (NÍVEL ACADÊMICO) 👇 */
                                                                <div className="flex flex-wrap gap-2 animate-fade-in">
                                                                    {aiSummary && (
                                                                        <button
                                                                            onClick={handleSendSummaryToNotes}
                                                                            className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all flex items-center gap-2 shadow-lg shadow-emerald-600/30 border border-emerald-400/30 mr-2"
                                                                        >
                                                                            <StickyNote size={14}/> Gravar no Diário
                                                                        </button>
                                                                    )}
                                                                    {[
                                                                        { id: 'short', label: 'Resumo Executivo', icon: <Zap size={14}/>, prompt: 'Gere uma Síntese Executiva de alto nível em 3 parágrafos densos e acadêmicos. Sem introduções informais. Use 🔵 para destacar.' },
                                                                        { id: 'detailed', label: 'Análise Acadêmica', icon: <ListTodo size={14}/>, prompt: 'Produza uma análise detalhada por tópicos (Bullet Points), utilizando terminologia avançada da área. Use 🟢 para separar seções de estudo.' },
                                                                        { id: 'mega', label: 'Tratado Técnico (Mega)', icon: <Sparkles size={14}/>, prompt: 'Gere um Tratado Técnico ultra-detalhado. Separe por CAPÍTULOS, use terminologia de Doutorado, aprofunde-se em cada nuance citada. Use 🔴 para títulos e 🟣 para sub-notas.' }
                                                                    ].map((opt) => (
                                                                        <button
                                                                            key={opt.id}
                                                                            disabled={isSummarizing}
                                                                            onClick={async () => {
                                                                                setIsSummarizing(true);
                                                                                try {
                                                                                    const response = await fetch("https://meu-backend-ia.vercel.app/api/chat", {
                                                                                        method: "POST", headers: { "Content-Type": "application/json" },
                                                                                        body: JSON.stringify({ message: `AÇÃO ACADÊMICA: ${opt.prompt}\n\nCONTEÚDO BASE PARA ANÁLISE:\n${transcriptionText}` })
                                                                                    });
                                                                                    const data = await response.json();
                                                                                    setAiSummary(data.reply);
                                                                                    showNotification(`Modo ${opt.label} ativado!`, "success");
                                                                                } catch(e) { showNotification("Erro ao refinar.", "error"); }
                                                                                finally { setIsSummarizing(false); }
                                                                            }}
                                                                            className={`px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center gap-2 transition-all border ${isSummarizing ? 'opacity-50 cursor-wait' : 'bg-white/5 hover:bg-white/10 text-white border-white/10'}`}
                                                                        >
                                                                            {opt.icon} {opt.label}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                                
                                                <div className="flex-1 flex flex-col justify-center min-h-[300px]">
                                                    {aiSummary ? (
                                                        <div className={`bg-black/40 rounded-2xl p-6 md:p-8 text-slate-200 text-base leading-relaxed whitespace-pre-wrap animate-fade-in border border-white/10 relative ${isSummarizing ? 'opacity-40' : 'opacity-100'}`}>
                                                            {isSummarizing && (
                                                                <div className="absolute inset-0 flex items-center justify-center z-10">
                                                                    <div className="bg-indigo-600 text-white px-6 py-2 rounded-full font-bold animate-bounce shadow-2xl">A IA está a pensar...</div>
                                                                </div>
                                                            )}
                                                            {aiSummary}
                                                        </div>
                                                    ) : (
                                                        <div className="text-center py-20 bg-white/5 rounded-[2rem] border border-dashed border-white/10">
                                                            <Sparkles size={60} className="mx-auto mb-6 text-indigo-500/20"/>
                                                            <p className="text-slate-500 text-xs font-bold uppercase tracking-[0.2em]">Finalize a transcrição para libertar o resumo</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                            {/* 👆 FIM DA ABA DE TRANSCRIÇÃO 👆 */}
                            
                        </div>
                    </div>

                    <div className={`platform-course-curriculum min-w-0 flex flex-col border-t sm:border border-[#222] sm:rounded-2xl shadow-2xl bg-[#0f0f0f] transition-all duration-500 relative z-20 h-[500px] sm:h-[600px] lg:h-full lg:overflow-hidden mt-4 lg:mt-0 ${isCinemaMode ? 'hidden lg:flex lg:w-0 lg:opacity-0 lg:translate-x-full' : 'w-full lg:w-[30%] xl:w-[25%] opacity-100 translate-x-0'}`}>
                        
                        <div className="p-4 sm:p-6 border-b border-[#222] bg-[#0a0a0a] shrink-0">
                            <h3 className="font-black text-sm uppercase tracking-widest text-white/50 mb-4">Grade Curricular</h3>
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 rounded-full border-4 border-[#222] flex items-center justify-center font-bold text-xs text-indigo-400 shrink-0">
                                    {progressPercent}%
                                </div>
                                <div className="flex-1">
                                    <div className="flex justify-between text-xs font-bold text-white mb-1.5">
                                        <span>Progresso</span>
                                        <span>{validCompletedCount}/{totalLessons}</span>
                                    </div>
                                    <div className="w-full h-1.5 bg-[#222] rounded-full overflow-hidden">
                                        <div className="h-full bg-indigo-500 rounded-full transition-all duration-1000" style={{ width: `${progressPercent}%` }}></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            {modules.map((mod, mIdx) => {
                                const isExpanded = expandedModules[mIdx];
                                const modAulas = mod.aulas || [];
                                const modCompleted = modAulas.filter((_, lIdx) => completedMap[`${mIdx}-${lIdx}`]).length;
                                
                                return (
                                    <div key={mIdx} className="border-b border-[#222]">
                                        <button 
                                            onClick={() => toggleModule(mIdx)}
                                            className="w-full px-4 sm:px-6 py-4 sm:py-5 flex items-center justify-between hover:bg-white/5 transition-colors text-left"
                                        >
                                            <div className="flex-1 pr-4">
                                                <h4 className="font-bold text-white text-sm leading-snug">{mod.titulo}</h4>
                                                <p className="text-[10px] font-bold uppercase tracking-widest text-white/40 mt-1">{modCompleted} / {modAulas.length} Aulas</p>
                                            </div>
                                            <ChevronDown className={`w-4 h-4 text-white/40 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} />
                                        </button>
                                        
                                        <div className={`overflow-hidden transition-all duration-300 ${isExpanded ? 'max-h-[2000px]' : 'max-h-0'}`}>
                                            <div className="flex flex-col pb-2">
                                                {modAulas.map((lesson, lIdx) => {
                                                    const isActive = activeModuleIndex === mIdx && activeLessonIndex === lIdx;
                                                    const isCompleted = completedMap[`${mIdx}-${lIdx}`];

                                                    return (
                                                        <div 
                                                            key={lIdx} 
                                                            onClick={() => { if (!canOpenLesson(mIdx, lIdx)) { showNotification(releaseMessage, "info"); return; } setActiveModuleIndex(mIdx); setActiveLessonIndex(lIdx); }}
                                                            aria-disabled={!canOpenLesson(mIdx, lIdx)}
                                                            className={`px-4 sm:px-6 py-3 sm:py-4 flex gap-3 sm:gap-4 cursor-pointer transition-all border-l-4 ${isActive ? 'bg-indigo-600/10 border-indigo-500' : 'border-transparent hover:bg-white/5'}`}
                                                        >
                                                            <div className="w-20 sm:w-24 h-14 sm:h-16 bg-[#1a1a1a] rounded-lg overflow-hidden shrink-0 relative border border-[#333]">
                                                                <img src={lesson.thumbnailUrl || course.cover || "https://images.unsplash.com/photo-1616469829941-c7200edec809?q=80&w=600&auto=format&fit=crop"} className="w-full h-full object-cover opacity-60" alt="Thumb" />
                                                                <div className="absolute inset-0 flex items-center justify-center">
                                                                    {!canOpenLesson(mIdx, lIdx) ? <Lock size={16} className="text-amber-400" /> : isActive ? <Play size={16} className="text-white" fill="currentColor"/> : (isCompleted ? <CheckCircle size={16} className="text-green-400" fill="currentColor"/> : <Play size={16} className="text-white/50" />)}
                                                                </div>
                                                            </div>
                                                            
                                                            <div className="flex-1 flex flex-col justify-center min-w-0">
                                                                <h5 className={`text-xs font-bold line-clamp-2 leading-tight ${isActive ? 'text-indigo-400' : 'text-white/80'}`}>
                                                                    {lIdx + 1}. {lesson.titulo}
                                                                    {!canOpenLesson(mIdx, lIdx) && <small className="block mt-1 text-amber-400 normal-case">{releaseMessage}</small>}
                                                                </h5>
                                                                <span className="text-[10px] text-white/40 mt-1 flex items-center gap-1 font-bold uppercase">
                                                                    {lesson.tipo === 'video' ? <Video size={10}/> : <FileText size={10}/>} {lesson.tipo}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        <div className="p-4 sm:p-6 border-t border-[#222] bg-[#0a0a0a] shrink-0">
                            {activeModuleIndex === modules.length - 1 && activeLessonIndex === (currentModule.aulas?.length || 1) - 1 ? (
                                <button onClick={onFinishCourse} className="w-full py-3 sm:py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm transition-colors flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(79,70,229,0.3)]">
                                    <CheckCircle size={16} /> Finalizar Curso 
                                </button>
                            ) : (
                                <button onClick={handleNextLesson} className="w-full py-3 sm:py-3.5 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-sm transition-colors flex items-center justify-center gap-2">
                                    Próxima Etapa <ArrowRight size={16} />
                                </button>
                            )}
                        </div>
                    </div>
                </div>

                {/* 👇 MODAL GLOBAL DE PRÉ-VISUALIZAÇÃO DE MATERIAIS 👇 */}
                {previewMaterial && (
                    <div className="fixed inset-0 z-[999999] flex items-center justify-center bg-black/95 backdrop-blur-md p-4 sm:p-8 animate-fade-in" onClick={() => setPreviewMaterial(null)}>
                        
                        <button onClick={() => setPreviewMaterial(null)} className="absolute top-4 right-4 md:top-6 md:right-6 z-[1000000] bg-white/10 hover:bg-red-500 text-white p-3 rounded-full border border-white/20 transition-all shadow-2xl cursor-pointer backdrop-blur-md">
                            <X size={24} />
                        </button>
                        
                        <div className="relative w-full max-w-5xl h-[85vh] bg-[#0a0a0f] rounded-2xl md:rounded-3xl border border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
                            
                            <div className="p-4 md:p-5 bg-[#111] border-b border-white/10 shrink-0 flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-indigo-500/20 text-indigo-400 rounded-lg">
                                        {previewMaterial.url?.match(/\.(jpeg|jpg|gif|png|webp)$/i) ? <ImageIcon size={20} /> : <FileText size={20} />}
                                    </div>
                                    <h3 className="text-white font-bold text-base md:text-lg truncate pr-4">{previewMaterial.titulo || 'Pré-visualização'}</h3>
                                </div>
                                <button onClick={() => handleForceDownload(fixUrl(previewMaterial.url), previewMaterial.titulo || 'Anexo')} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-xs md:text-sm font-bold flex items-center gap-2 transition-colors shrink-0 shadow-md">
                                    <Download size={16} /> <span className="hidden sm:inline">Baixar Arquivo</span><span className="sm:hidden">Baixar</span>
                                </button>
                            </div>

                            <div className="flex-1 w-full h-full relative flex items-center justify-center p-0 md:p-6 bg-[#050505] overflow-hidden">
                                {(() => {
                                    const url = fixUrl(previewMaterial.url || '').toLowerCase();
                                    const type = previewMaterial.tipo || 'arquivo';

                                    if (type === 'image' || url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                                        return <img src={url} className="max-w-full max-h-full object-contain rounded-none md:rounded-xl" alt="Preview" />;
                                    } else if (type === 'video' || url.match(/\.(mp4|webm|ogg|mov)$/i)) {
                                        return <video src={url} controls autoPlay className="max-w-full max-h-full object-contain rounded-none md:rounded-xl bg-black" />;
                                    } else {
                                        // O segredo do PDF: tag iframe forçada a ajustar na tela (FitH)
                                        return <iframe src={`${url}#view=FitH`} className="w-full h-full rounded-none md:rounded-xl bg-white border-none"></iframe>;
                                    }
                                })()}
                            </div>
                        </div>
                    </div>
                )}
                {/* 👆 FIM DO MODAL DE PRÉ-VISUALIZAÇÃO 👆 */}

            </div>
        );
    };
    // =================================================================================
    // FIM DO COMPONENTE COURSE PLAYER
    // ================================================================================

// =================================================================================
// COMPONENTE COMPARTILHADO: RENDERIZADOR DE CERTIFICADO UNIFICADO (ADMIN E ALUNO)
// =================================================================================
const CertificateRenderer = ({ 
    bgUrl, 
    fields = [], 
    containerRef, 
    onMouseDown, 
    selectedFieldId = null, 
    previewMode = true,
    studentData = {},
    scale = 1
}) => {
    
    const BASE_WIDTH = 1123;
    const BASE_HEIGHT = 794;

    const resolveMacro = (field) => {
        if (!previewMode && studentData) {
            if (field.type === 'macro_studentName' || field.type === 'studentName') return studentData.nome || 'NOME DO ALUNO';
            if (field.type === 'macro_courseName' || field.type === 'courseName') return studentData.curso || 'NOME DO CURSO';
            if (field.type === 'macro_date' || field.type === 'date') return studentData.dataConclusao || 'DD/MM/AAAA';
            if (field.type === 'macro_workload') return studentData.cargaHoraria || 'X Horas';
            if (field.type === 'macro_cpf' || field.type === 'cpf') return studentData.custom?.CPF || '000.000.000-00';
            if (field.type === 'custom_macro' && studentData.custom) return studentData.custom[field.label] || field.label;
            if (field.type === 'fixedText' || field.type === 'customText') return field.label;
            if (field.type === 'macro_completionText') return `Certificamos que o aluno(a) ${studentData.nome || 'NOME DO ALUNO'} concluiu com êxito o curso ${studentData.curso || 'NOME DO CURSO'} no dia ${studentData.dataConclusao || 'DD/MM/AAAA'}.`;
            if (field.type === 'macro_signature' || field.type === 'signature') return studentData.nome || 'NOME DO ALUNO';
        }
        if (field.type === 'macro_completionText') return 'Certificamos que o aluno(a) NOME COMPLETO DO ALUNO DA SILVA concluiu com êxito o curso TÍTULO DO CURSO DE EXEMPLO no dia 31/12/2026.';
        if (field.type === 'macro_signature') return 'Assinatura do Aluno';
        return field.label || 'Texto';
    };

    return (
        <div style={{ width: '100%', display: 'flex', justifyContent: 'center', overflow: 'hidden', padding: '20px 0' }}>
            <div 
                ref={containerRef}
                style={{
                    position: 'relative', width: `${BASE_WIDTH}px`, height: `${BASE_HEIGHT}px`,
                    backgroundImage: bgUrl ? `url(${bgUrl})` : 'none', backgroundSize: '100% 100%',
                    backgroundPosition: 'center', backgroundRepeat: 'no-repeat', backgroundColor: '#fff',
                    boxShadow: '0 10px 30px rgba(0,0,0,0.15)', transform: `scale(${scale})`,
                    transformOrigin: 'top center', marginBottom: `-${BASE_HEIGHT * (1 - scale)}px`
                }}
            >
                {fields.map(field => {
                    const isSelected = selectedFieldId === field.id;
                    const isDescription = field.type === 'macro_completionText';
                    
                    if (field.type === 'image') {
                        return (
                            <img 
                                key={field.id} src={field.url} onMouseDown={(e) => onMouseDown && onMouseDown(e, field.id)}
                                style={{
                                    position: 'absolute', left: `${field.x}%`, top: `${field.y}%`, width: `${field.width || 150}px`,
                                    transform: `translate(-50%, -50%) rotate(${field.rotation || 0}deg)`,
                                    cursor: onMouseDown ? 'move' : 'default', border: isSelected ? '2px dashed #4f46e5' : 'none',
                                    userSelect: 'none', WebkitUserDrag: 'none', zIndex: isSelected ? 30 : 20
                                }}
                                draggable="false" alt="Elemento"
                            />
                        );
                    }

                    if (field.type === 'line') {
                        return (
                            <div key={field.id} onMouseDown={(e) => onMouseDown && onMouseDown(e, field.id)}
                                style={{
                                    position: 'absolute', left: `${field.x}%`, top: `${field.y}%`,
                                    width: `${field.width || 300}px`, height: `${field.height || 2}px`, backgroundColor: field.color || '#000000',
                                    transform: `translate(-50%, -50%) rotate(${field.rotation || 0}deg)`,
                                    cursor: onMouseDown ? 'move' : 'default', border: isSelected ? '2px dashed #4f46e5' : 'none',
                                    zIndex: isSelected ? 30 : 20, borderRadius: '2px'
                                }}
                            />
                        );
                    }

                    return (
                        <div key={field.id} onMouseDown={(e) => onMouseDown && onMouseDown(e, field.id)}
                            style={{
                                position: 'absolute', left: `${field.x}%`, top: `${field.y}%`, 
                                transform: `translate(-50%, -50%) rotate(${field.rotation || 0}deg)`, 
                                color: field.color || '#000', opacity: 0.92, mixBlendMode: 'multiply', 
                                textShadow: `0px 0px 0.5px ${field.color || '#000'}`,
                                fontSize: `${field.fontSize || 30}px`, fontFamily: field.fontFamily || 'Arial',
                                fontWeight: field.fontWeight || 'normal', textAlign: field.textAlign || 'center',
                                width: isDescription ? '85%' : '100%', whiteSpace: isDescription ? 'normal' : 'nowrap',
                                cursor: onMouseDown ? 'move' : 'default', border: isSelected ? '2px dashed #4f46e5' : '2px solid transparent',
                                padding: '4px', userSelect: 'none', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: isSelected ? 30 : 20
                            }}
                        >
                            {resolveMacro(field)}
                        </div>
                    );
                })}
            </div>
        </div>
    );
};

    
    
// --- COMPONENTE DE CARTÃO (PREVIEW DO CERTIFICADO NO PAINEL DO ALUNO) ---
const CertificateCard = ({ user, course, template, customPdf, onExpand, progressInfo }) => {
    const [userData, setUserData] = React.useState(user);
    const wrapperRef = React.useRef(null);
    const [scale, setScale] = React.useState(1);

    // Busca os dados atualizados do usuário (CPF, RG, etc)
    React.useEffect(() => {
        const fetchExtras = async () => {
            if (!user?.uid || typeof db === 'undefined') return;
            try {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) setUserData(prev => ({ ...prev, ...docSnap.data() }));
            } catch(e) {}
        };
        fetchExtras();
    }, [user]);

    // Calcula a escala para o certificado caber dentro do cartãozinho (thumbnail)
    React.useEffect(() => {
        if (wrapperRef.current && template) {
            const availableWidth = wrapperRef.current.clientWidth;
            // 1123 é a largura base. Damos um zoom out drástico.
            setScale(availableWidth / 1123);
        }
    }, [template]);

    // Prepara os dados dinâmicos do aluno para o renderizador
    const dadosAluno = {
        nome: userData.displayName || userData.name || userData.nome || "Aluno sem Nome",
        curso: course.title || course.titulo || "Curso",
        dataConclusao: progressInfo?.completedAt 
            ? (progressInfo.completedAt.seconds 
                ? new Date(progressInfo.completedAt.seconds * 1000).toLocaleDateString('pt-BR') 
                : new Date(progressInfo.completedAt).toLocaleDateString('pt-BR'))
            : new Date().toLocaleDateString('pt-BR'),
        cargaHoraria: course.workload || '40 Horas',
        custom: {
            "CPF": userData.cpf ? `CPF: ${userData.cpf}` : "CPF não cadastrado"
        }
    };

    return (
        <div 
            className="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm hover:shadow-md transition-all flex flex-col gap-4 group cursor-pointer"
            onClick={() => (template || customPdf) ? onExpand(course, template, customPdf, progressInfo) : null}
        >
            <div 
                ref={wrapperRef}
                className="relative bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-600 flex items-center justify-center pointer-events-none" 
                style={{ height: '200px' }} // Altura fixa para o thumbnail
            >
                {customPdf ? (
                    <>
                        <div className="absolute inset-0 w-full h-full bg-white dark:bg-slate-800 overflow-hidden flex items-center justify-center pointer-events-none">
                            {customPdf.toLowerCase().includes('.pdf') ? (
                                <iframe src={`${customPdf}#page=1&view=FitH&toolbar=0&navpanes=0&scrollbar=0`} className="w-[105%] h-[105%] pointer-events-none border-none select-none" scrolling="no" />
                            ) : (
                                <img src={customPdf} className="w-full h-full object-cover" />
                            )}
                        </div>
                        <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center z-20 gap-3 backdrop-blur-[2px]">
                            <Award size={36} className="text-white drop-shadow-md" />
                            <div className="bg-indigo-600 text-white px-5 py-2.5 rounded-full font-bold shadow-xl transform scale-90 group-hover:scale-100 transition-transform flex items-center gap-2 text-sm">
                                <Maximize size={18}/> Ver Certificado
                            </div>
                        </div>
                    </>
                ) : template ? (
                    <div className="flex items-center justify-center" style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
                        <CertificateRenderer 
                            bgUrl={template.bgUrl} 
                            fields={template.fields} 
                            previewMode={false} 
                            studentData={dadosAluno}
                            scale={1} // Mandamos 1 porque o Wrapper por fora já está fazendo o zoom out
                        />
                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center z-20">
                            <div className="bg-white text-slate-800 px-4 py-2 rounded-full font-bold shadow-lg transform scale-90 group-hover:scale-100 transition-transform flex items-center gap-2">
                                <Maximize size={16}/> Ampliar
                            </div>
                        </div>
                    </div>
                ) : (
                    <div className="w-full h-full flex flex-col items-center justify-center text-slate-500 py-8 px-4 text-center bg-slate-800/50">
                        <Clock size={40} className="opacity-40 mb-3 text-yellow-500"/>
                        <span className="text-xs font-bold text-slate-300">Certificado em elaboração</span>
                    </div>
                )}
            </div>
            
            <div>
                <h4 className="font-bold text-slate-800 dark:text-white mb-1 line-clamp-1">{course.title}</h4>
                <p className="text-xs text-slate-500">{customPdf ? 'PDF Oficial Disponível' : (template ? 'Documento Oficial Liberado' : 'Aguardando Arte')}</p>
            </div>
        </div>
    );
};
    
// =================================================================================
// --- SEÇÃO PRINCIPAL E MODAL DE DOWNLOAD DE CERTIFICADOS ---
// =================================================================================
const CertificatesSection = ({ user, courses, userProgress, certificates, customCerts }) => {
    const [expandedCert, setExpandedCert] = React.useState(null); 
    const [previewHighRes, setPreviewHighRes] = React.useState(null);

    React.useEffect(() => {
        if (!expandedCert) return;
        setPreviewHighRes(null);

        const { course, template, progressInfo, customPdf } = expandedCert;
        
        // Se for um arquivo PDF ou Imagem direto (customizado), não usamos Canvas
        if (customPdf) {
            setPreviewHighRes('custom_ready');
            return;
        }
        
        if (!template?.bgUrl) {
            setPreviewHighRes('erro_cors');
            return;
        }

        // Função vital para lidar com domínios e evitar bloqueios
        const fixUrl = (url) => {
            if (!url) return null;
            const wrongDomain = "https://pub-2ece542306d80259e71a793d20f91a60.r2.dev";
            const rightDomain = "https://pub-263c6a7252164111a104a68e6835cfc4.r2.dev";
            let safeUrl = url.includes(wrongDomain) ? url.replace(wrongDomain, rightDomain) : url;
            
            // TRUQUE MÁGICO DO CACHE BUSTER: Impede o navegador de usar a imagem bugada do cache
            return safeUrl + (safeUrl.includes('?') ? '&' : '?') + 'cb=' + new Date().getTime();
        };

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = "Anonymous"; // Essencial para exportar o certificado depois
        img.src = fixUrl(template.bgUrl);

        // Proteção contra loop infinito de carregamento
        img.onerror = () => {
            console.error("Erro ao carregar a imagem do certificado. Verifique as configurações de CORS.");
            setPreviewHighRes('erro_cors');
        };

        img.onload = async () => {
            let finalUser = user;
            try {
                if (typeof db !== 'undefined') {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if (docSnap.exists()) finalUser = { ...user, ...docSnap.data() };
                }
            } catch(e) {}

            canvas.width = img.width;
            canvas.height = img.height;
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.drawImage(img, 0, 0);

            if (template.fields && template.fields.length > 0) {
                const ratio = w / 1000; 
                
                // 1. IMAGENS LOGOS E SELOS (COM ROTAÇÃO)
                const imageFields = template.fields.filter(f => f.type === 'image');
                for (let field of imageFields) {
                    if (!field.url) continue;
                    try {
                        const imgMacro = new Image();
                        imgMacro.crossOrigin = "Anonymous";
                        imgMacro.src = fixUrl(field.url);
                        await new Promise((resolve, reject) => { imgMacro.onload = resolve; imgMacro.onerror = reject; });
                        
                        let pxX = (parseFloat(field.x) / 100) * w;
                        let pxY = (parseFloat(field.y) / 100) * h;
                        let targetW = (parseFloat(field.width) || 150) * ratio;
                        let targetH = imgMacro.height * (targetW / imgMacro.width);
                        
                        ctx.save();
                        ctx.translate(pxX, pxY);
                        ctx.rotate((field.rotation || 0) * Math.PI / 180);
                        ctx.drawImage(imgMacro, -targetW / 2, -targetH / 2, targetW, targetH);
                        ctx.restore();
                    } catch(e) { console.warn("Aviso: Falha ao carregar macro de imagem.", e); }
                }

                // 2. LINHAS GEOMÉTRICAS
                const lineFields = template.fields.filter(f => f.type === 'line');
                for (let field of lineFields) {
                    const pxX = (parseFloat(field.x) / 100) * w;
                    const pxY = (parseFloat(field.y) / 100) * h;
                    const targetW = (parseFloat(field.width) || 300) * ratio;
                    const targetH = (parseFloat(field.height) || 2) * ratio;

                    ctx.save();
                    ctx.translate(pxX, pxY);
                    ctx.rotate((field.rotation || 0) * Math.PI / 180);
                    ctx.fillStyle = field.color || "#000000";
                    ctx.fillRect(-targetW / 2, -targetH / 2, targetW, targetH);
                    ctx.restore();
                }

                // 3. TEXTOS E MACROS AUTOMÁTICAS
                const textFields = template.fields.filter(f => f.type !== 'image' && f.type !== 'line');
                for (let field of textFields) {
                    let pxX = (parseFloat(field.x) / 100) * w;
                    let pxY = (parseFloat(field.y) / 100) * h;
                    const fontSizePx = (parseFloat(field.fontSize) || 30) * ratio;

                    let type = field.type || "";
                    let originalText = String(field.label || field.text || "");
                    let cleanText = originalText.toUpperCase().trim();

                    let isName = type.includes('studentName') || cleanText.includes("NOME DO ALUNO") || cleanText === "NOME" || cleanText.includes("MACRO_NOME");
                    let isCPF = type.includes('cpf') || cleanText.includes("CPF");
                    let isCourse = type.includes('courseName') || cleanText.includes("NOME DO CURSO");
                    let isDate = type.includes('date') || cleanText.includes("DATA");
                    let isSignature = type.includes('signature') || cleanText.includes("ASSINATURA");
                    let isDescription = type.includes('completionText') || cleanText.includes("TEXTO CONCLUS");
                    
                    let fontWeight = isSignature ? 'normal' : (field.fontWeight || 'bold');
                    let fontStyle = isSignature ? 'italic' : 'normal';
                    let fontFamily = isSignature ? "'Brush Script MT', 'Dancing Script', 'Great Vibes', cursive" : (field.fontFamily || 'Arial');
                    
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle"; 
                    ctx.fillStyle = field.color || "#000000";
                    ctx.globalCompositeOperation = "multiply"; 
                    ctx.globalAlpha = 0.92; 
                    ctx.shadowColor = field.color || "#000000"; 
                    ctx.shadowBlur = 1.5; 
                    
                    const alunoData = finalUser || user || {};
                    const nomeAluno = alunoData.name || alunoData.displayName || user.displayName || "Aluno";
                    const cpfStr = alunoData.cpf || "CPF não cadastrado";
                    const cName = course.title || course.titulo || "Curso sem título";
                    
                    let dateStr = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    if (progressInfo?.completedAt) {
                        const d = progressInfo.completedAt.seconds ? new Date(progressInfo.completedAt.seconds * 1000) : new Date(progressInfo.completedAt);
                        if (!isNaN(d.getTime())) dateStr = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    }

                    let textoFinal = originalText;
                    if (isName) textoFinal = nomeAluno;
                    else if (isCPF) textoFinal = `CPF: ${cpfStr}`;
                    else if (isCourse) textoFinal = cName;
                    else if (isDate) textoFinal = `Conclusão: ${dateStr}`;
                    else if (isSignature) textoFinal = nomeAluno; 
                    else if (isDescription) textoFinal = `Certificamos que o aluno(a) ${nomeAluno} concluiu com êxito o curso ${cName} no dia ${dateStr}.`;
                    else if (field.type === 'custom_macro') {
                        const macroName = field.label.trim();
                        textoFinal = course[macroName] || alunoData[macroName] || ""; 
                    } else if (field.type === 'fixedText' || field.type === 'customText') {
                        textoFinal = field.label;
                    }

                    if (!textoFinal || String(textoFinal).trim() === "") continue;

                    let maxAvailableWidth = Math.min(pxX, w - pxX) * 2 * 0.90; 

                    ctx.save();
                    ctx.translate(pxX, pxY);
                    ctx.rotate((field.rotation || 0) * Math.PI / 180);

                    if (isDescription || textoFinal.length > 50) {
                        ctx.font = `${fontStyle} ${fontWeight} ${fontSizePx}px ${fontFamily}`;
                        const words = textoFinal.split(' ');
                        let line = ''; const lines = [];

                        for(let n = 0; n < words.length; n++) {
                            const testLine = line + words[n] + ' ';
                            const metrics = ctx.measureText(testLine);
                            if (metrics.width > maxAvailableWidth && n > 0) { 
                                lines.push(line.trim()); line = words[n] + ' '; 
                            } else { line = testLine; }
                        }
                        lines.push(line.trim());
                        
                        let currentY = 0 - (((lines.length - 1) * (fontSizePx * 1.5)) / 2);
                        for(let i = 0; i < lines.length; i++) {
                            ctx.fillText(lines[i], 0, currentY);
                            currentY += (fontSizePx * 1.5);
                        }
                    } else {
                        let currentFontSize = fontSizePx;
                        ctx.font = `${fontStyle} ${fontWeight} ${currentFontSize}px ${fontFamily}`;
                        let metrics = ctx.measureText(textoFinal);
                        
                        while (metrics.width > maxAvailableWidth && currentFontSize > 10) {
                            currentFontSize -= 1;
                            ctx.font = `${fontStyle} ${fontWeight} ${currentFontSize}px ${fontFamily}`;
                            metrics = ctx.measureText(textoFinal);
                        }
                        ctx.fillText(textoFinal, 0, 0);
                    }
                    ctx.restore();
                }
                ctx.globalCompositeOperation = "source-over";
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }

            try {
                setPreviewHighRes(canvas.toDataURL('image/jpeg', 1.0));
            } catch(err) {
                console.error("Falha ao exportar o Canvas. Ocorreu bloqueio de CORS:", err);
                setPreviewHighRes('erro_cors');
            }
        };
    }, [expandedCert, user]);

    const handleExpand = (course, template, customPdf, progressInfo) => setExpandedCert({ course, template, customPdf, progressInfo });
    const handleClose = () => { setExpandedCert(null); setPreviewHighRes(null); };

    const handleDownloadGeneratedCertificate = () => {
        if (!previewHighRes || previewHighRes === 'erro_cors') return;
        const link = document.createElement('a');
        link.download = `Certificado_${user.displayName || 'Aluno'}_${expandedCert.course.title.replace(/\s+/g, '_')}.jpg`;
        link.href = previewHighRes;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    const availableCertificates = courses.filter(course => {
        const prog = userProgress ? userProgress[course.id] : null;
        if (prog && prog.percentage >= 99) return true;
        let total = 0; let completed = 0;
        if(course.modulos) {
            course.modulos.forEach((mod, mIdx) => {
                if(mod.aulas) mod.aulas.forEach((_, lIdx) => {
                    total++;
                    if(localStorage.getItem(`completed_${user.uid}_${course.id}_${mIdx}_${lIdx}`) === 'true') completed++;
                });
            });
        }
        return total > 0 && completed >= total;
    });

    return (
        <div className="space-y-4 md:space-y-10 animate-fade-in max-w-[100rem] mx-auto mt-16 md:mt-28 mb-10 px-3 md:px-8 lg:px-12 font-sans">
            <div className="flex items-center gap-2 md:gap-5 mb-3 md:mb-8 px-1">
               <div className="p-2 md:p-5 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 rounded-lg md:rounded-2xl shadow-inner">
                   <Award className="w-5 h-5 md:w-8 md:h-8" />
               </div>
               <div>
                   <h2 className="text-xl md:text-4xl font-black text-slate-800 dark:text-white tracking-tight">Galeria de Certificados</h2>
                   <p className="text-slate-500 dark:text-slate-400 text-[10px] md:text-base mt-0.5 md:mt-1.5">Visualize e baixe seus certificados de conclusão.</p>
               </div>
           </div>

           {availableCertificates.length === 0 ? (
               <div className="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl md:rounded-3xl p-8 md:p-24 flex flex-col items-center justify-center text-center bg-slate-50/50 dark:bg-slate-900/50 min-h-[200px] md:min-h-[400px]">
                   <div className="w-12 h-12 md:w-24 md:h-24 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-400 mb-3 md:mb-8">
                       <Lock className="w-6 h-6 md:w-12 md:h-12" />
                   </div>
                   <h4 className="font-extrabold text-base md:text-3xl text-slate-700 dark:text-slate-200 mb-1.5 md:mb-4">Nenhuma conquista ainda</h4>
                   <p className="text-slate-500 text-xs md:text-lg max-w-sm md:max-w-xl leading-relaxed">Complete 100% de um curso para liberar seu certificado e registrar sua conquista aqui.</p>
               </div>
           ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {availableCertificates.map(course => {
                        const template = certificates.find(c => c.courseId === course.id);
                        const customPdf = customCerts ? customCerts[course.id] : null; 
                        return (
                            <CertificateCard 
                                key={course.id} user={user} course={course} template={template}
                                customPdf={customPdf} progressInfo={userProgress ? userProgress[course.id] : null}
                                onExpand={handleExpand} 
                            />
                        );
                    })}
                </div>
            )}

           {expandedCert && (
               <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in" onClick={handleClose}>
                   <div className="w-full max-w-4xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl flex flex-col relative overflow-hidden border border-slate-200 dark:border-slate-700 animate-scale-in" onClick={e => e.stopPropagation()}>
                       
                       <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50 shrink-0">
                           <h3 className="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2 truncate pr-4">
                               <Award className="text-indigo-500 shrink-0" size={24}/> Certificado de Conclusão
                           </h3>
                           <button onClick={handleClose} className="text-slate-400 hover:text-red-500 transition-colors p-1">
                               <X size={24} />
                           </button>
                       </div>

                       {/* ÁREA DE CARREGAMENTO / VISUALIZAÇÃO DO CERTIFICADO CORRIGIDA */}

        // --- LÓGICA DE DADOS ---
        useEffect(() => {
            const fetchUserData = async () => {
                if(!db) return;
                try {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if(docSnap.exists()) setUserData(prev => ({...prev, ...docSnap.data()}));
                } catch (error) { console.error("Erro ao buscar perfil", error); }
            };
            fetchUserData();
        }, [user]);

        const handleChange = (field, value) => setUserData(prev => ({ ...prev, [field]: value }));
        
        const handleCpfChange = (e) => { 
            let v = e.target.value.replace(/\D/g, '').slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            handleChange('cpf', v);

        };

            let v = e.target.value.replace(/\D/g, '').slice(0, 8);
            v = v.replace(/^(\d{5})(\d)/, '$1-$2');
            handleChange('zipCode', v);
            if (v.replace(/\D/g, '').length === 8) {
                try {
                    const res = await fetch(`https://viacep.com.br/ws/${v.replace('-','')}/json/`);
                    const data = await res.json();
                    if (!data.erro) setUserData(prev => ({ ...prev, address: data.logradouro, neighborhood: data.bairro, city: data.localidade, state: data.uf }));
                } catch (err) { }
            }
        };

        const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (readerEvent) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > 300) { height *= 300 / width; width = 300; } } else { if (height > 300) { width *= 300 / height; height = 300; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    handleChange('photoBase64', canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = readerEvent.target.result;
            };
            reader.readAsDataURL(file);
        };

    };
    // =================================================================================
    // FIM DO COMPONENTE PERFIL
    // =================================================================================
// ======================================================
    // 1. CONFIGURAÇÃO DE UPLOAD (DADOS DO ADMIN)
    // ======================================================
    const getS3Client = () => {
        if (typeof AWS === 'undefined') {
            console.error("ERRO CRÍTICO: AWS SDK não foi carregado.");
            return null;
        }

        // DADOS DO ADMIN (Conexão Unificada)
        const accountId = '2ece542306d80259e71a793d20f91a60';
        const accessKeyId = '5365b5ba42a26381492e9869e322d27a';
        const secretAccessKey = '9c1257268d4892c92f9f43f7fd3a9eb5b0dcb6e29224c00a898c4cbffb1cc059';

        return new AWS.S3({
            endpoint: `https://${accountId}.r2.cloudflarestorage.com`,
            accessKeyId: accessKeyId,
            secretAccessKey: secretAccessKey,
            signatureVersion: 'v4',
            region: 'auto',
            s3ForcePathStyle: true,
            httpOptions: { timeout: 300000 } // 5 minutos de timeout
        });
    };

    // ======================================================
    // 2. FUNÇÃO DE UPLOAD CONECTADA (CONFIGURAÇÃO DEFINITIVA)
    // ======================================================
    const uploadToCustomDrive = async (file, folder = 'Community/') => {
        if (file && isConversationUpload(folder)) await assertConversationUploads();
        if (!file) return null;
        
        const s3 = getS3Client(); // Usa as credenciais do Admin
        if (!s3) {
            window.platformAlert("Erro: Biblioteca de upload não carregou.");
            return null;
        }

        const bucketName = 'test03'; 
        
        // ---------------------------------------------------------
        // ⚠️ ATENÇÃO: A CONEXÃO ESTÁ AQUI
        // ---------------------------------------------------------
        // Cole o link que você pegou no Cloudflare (Public Access) entre as aspas.
        // NÃO coloque a barra "/" no final.
        
        const publicDomain = "https://pub-263c6a7252164111a104a68e6835cfc4.r2.dev"; 
        
        // ---------------------------------------------------------

        // 👇 NOVO: Proteção para fotos do celular que vêm sem nome 👇
        const safeFileName = file.name || "mobile_upload.jpg";
        const parts = safeFileName.split('.');
        const extension = parts.length > 1 ? parts.pop().toLowerCase() : (file.type.split('/')[1] || 'jpg');
        const timestamp = Date.now();
        
        // Limpeza de nome segura
        const cleanName = parts[0]
            ? parts[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "")
            : "media"; 
        
        const uniqueFileName = `${timestamp}_${cleanName}.${extension}`;
        // 👆 FIM DO BLOCO NOVO 👆
        const key = `${folder}${uniqueFileName}`;

        // Define o tipo de arquivo corretamente
        let contentType = file.type;
        if (!contentType || contentType === '') {
            if(extension === 'png') contentType = 'image/png';
            else if(extension === 'jpg' || extension === 'jpeg') contentType = 'image/jpeg';
            else if(extension === 'mp4') contentType = 'video/mp4';
            else if(extension === 'pdf') contentType = 'application/pdf';
        }

        let detectedType = 'image';
        if (contentType.includes('video') || ['mp4', 'webm', 'mov', 'avi'].includes(extension)) {
            detectedType = 'video';
        } else if (contentType.includes('audio') || ['mp3', 'wav', 'ogg'].includes(extension)) {
            detectedType = 'audio';
        } else if (contentType.includes('pdf') || contentType.includes('application')) {
            detectedType = 'file';
        }

        const params = {
            Bucket: bucketName,
            Key: key,
            Body: file,
            ContentType: contentType
            // ACL removido pois R2 gerencia isso pelo Public Access
        };

        console.log(`[Upload R2] Iniciando envio para: ${publicDomain}/${key}`);

        return new Promise((resolve, reject) => {
            const upload = s3.upload(params);
            const stopWatchingUpload = watchConversationUpload(upload, folder);

            upload.on('httpUploadProgress', (evt) => {
                const percent = parseInt((evt.loaded * 100) / evt.total);
                console.log(`Progresso: ${percent}%`);
            });

            upload.send((err, data) => {
                stopWatchingUpload();
                if (err) {
                    console.error("❌ ERRO NO UPLOAD R2:", err);
                    window.platformAlert(`Falha no upload. Verifique o Console.`);
                    reject(err);
                } else {
                    // Monta o Link Final que vai aparecer no site
                    const finalUrl = `${publicDomain}/${key}`;
