                            <div className="max-w-[90rem] mx-auto px-6 md:px-12">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-24 items-center text-center md:text-left">
                                    <Reveal direction="up">
                                        <h2 className="text-2xl sm:text-3xl md:text-5xl font-black leading-tight tracking-tight max-w-xl mx-auto md:mx-0 text-white drop-shadow-md" style={{ fontFamily: settings?.heroTitleFont || '"Montserrat", sans-serif' }}>
                                            {settings?.socialQuote || '"A verdadeira jornada não consiste em buscar novas paisagens, mas em ter novos olhos."'}
                                        </h2>
                                    </Reveal>
                                    <Reveal delay={200}>
                                        <div className="space-y-6 md:space-y-8">
                                            <p className="font-light leading-relaxed text-base md:text-lg whitespace-pre-wrap text-slate-300">
                                                {settings?.socialDescription || 'Nossa metodologia foi desenhada para mentes inquietas que não se contentam com a superfície. Oferecemos um ecossistema high-end onde a tecnologia encontra a aplicabilidade prática.'}
                                            </p>
                                            <div className="grid grid-cols-2 gap-4 md:gap-8 pt-6 md:pt-8 border-t border-white/10">
                                                <div>
                                                    <p className="text-3xl md:text-5xl font-black mb-1 md:mb-2 text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400 drop-shadow-sm">{settings?.socialStat1Value || '100%'}</p>
                                                    <p className="text-[10px] md:text-xs text-white/50 tracking-[0.2em] uppercase font-bold">{settings?.socialStat1Label || 'Autoral'}</p>
                                                </div>
                                                <div>
                                                    <p className="text-3xl md:text-5xl font-black mb-1 md:mb-2 text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400 drop-shadow-sm">{settings?.socialStat2Value || '+5k'}</p>
                                                    <p className="text-[10px] md:text-xs text-white/50 tracking-[0.2em] uppercase font-bold">{settings?.socialStat2Label || 'Alunos'}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </Reveal>
                                </div>
                            </div>
                        </section>

                        {/* SEÇÃO VISUAL (SUBSTITUINDO OS CURSOS PELO CARROSSEL) */}
                        <section className="py-16 md:py-32 bg-transparent relative">
                            <div className="max-w-[90rem] mx-auto px-4 md:px-12 text-center">
                                <Reveal direction="up">
                                    <span className="text-primary tracking-[0.2em] text-[10px] md:text-sm font-black uppercase mb-4 block drop-shadow-md">
                                        {settings?.coursesSectionSubtitle || "Portais Disponíveis"}
                                    </span>
                                    <h2 className="text-3xl sm:text-4xl md:text-6xl font-black tracking-tight leading-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-purple-400 max-w-4xl mx-auto mb-10 md:mb-16 drop-shadow-xl" style={{ fontFamily: settings?.heroTitleFont || '"Montserrat", sans-serif' }}>
                                        {settings?.coursesSectionTitle || "Seus Caminhos de Transformação"}
                                    </h2>
                                </Reveal>

                                <Reveal delay={200}>
                                    {/* ========================================================= */}
                                    {/* INÍCIO DO CARROSSEL DE VÍDEOS (MEUS CURSOS) */}
                                    {/* ========================================================= */}
                                    <div 
                                        id="meuscursos-carousel-container" 
                                        className="relative w-full max-w-5xl mx-auto rounded-2xl md:rounded-[2rem] overflow-hidden bg-black aspect-video group shadow-[0_0_50px_rgba(79,70,229,0.2)] border border-white/10 transition-all duration-500"
                                    >
                                        <video id="carousel-video-player" className="w-full h-full object-cover" playsInline muted></video>

                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>

                                        <div className="absolute bottom-0 left-0 right-0 p-4 md:p-6 transition-opacity duration-300 opacity-0 group-hover:opacity-100 z-10">
                                            <div className="w-full h-1.5 md:h-2 bg-gray-600/50 rounded-full cursor-pointer overflow-hidden backdrop-blur-sm mb-4" id="carousel-progress-bg">
                                                <div id="carousel-progress-bar" className="h-full bg-indigo-500 w-0 transition-all duration-75 pointer-events-none"></div>
                                            </div>
                                            
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-4 md:gap-6">
                                                    <button id="carousel-play-btn" className="text-white hover:text-indigo-400 transition-colors focus:outline-none">
                                                        <svg id="icon-play" className="w-8 h-8 md:w-10 md:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                        <svg id="icon-pause" className="w-8 h-8 md:w-10 md:h-10 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                                    </button>
                                                    <button id="carousel-mute-btn" className="text-white hover:text-indigo-400 transition-colors focus:outline-none">
                                                        <svg id="icon-vol-on" className="w-6 h-6 md:w-7 md:h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                                        <svg id="icon-vol-off" className="w-6 h-6 md:w-7 md:h-7 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                                                    </button>
                                                    <span id="carousel-time" className="text-white text-xs md:text-sm font-mono tracking-wider font-bold shadow-sm">00:00 / 00:00</span>
                                                </div>
                                                <div id="carousel-counter" className="text-white/70 text-[10px] md:text-xs font-bold bg-black/40 px-3 py-1.5 rounded-full border border-white/10">1/1</div>
                                            </div>
                                        </div>

                                        <button id="carousel-prev-btn" className="absolute left-4 top-1/2 -translate-y-1/2 bg-black/50 text-white p-3 rounded-full hover:bg-black/90 hover:text-indigo-400 transition-all hidden z-10 focus:outline-none transform hover:scale-110 border border-white/10">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                                        </button>
                                        <button id="carousel-next-btn" className="absolute right-4 top-1/2 -translate-y-1/2 bg-black/50 text-white p-3 rounded-full hover:bg-black/90 hover:text-indigo-400 transition-all hidden z-10 focus:outline-none transform hover:scale-110 border border-white/10">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                        </button>
                                    </div>
                                    {/* ========================================================= */}
                                    {/* FIM DO CARROSSEL DE VÍDEOS */}
                                    {/* ========================================================= */}
                                </Reveal>
                            </div>
                        </section>
                    </div>
                </div>

                <div ref={wrapperRef2} className="relative z-10 bg-siteBg-dark transition-colors duration-500">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                        <div className="sticky top-0 w-full h-screen overflow-hidden bg-siteBg-dark">
                            {isVideo(tertiaryBg) ? (
                                <BackgroundVideo innerRef={bgRef2} src={tertiaryBg} className="w-full h-full object-cover" style={{ opacity: 0, transform: 'scale(1.1)', filter: 'blur(10px)', willChange: 'opacity, transform, filter' }} />
                            ) : (
                                <img ref={bgRef2} src={tertiaryBg} className="w-full h-full object-cover" alt="Fundo Terciário" style={{ opacity: 0, transform: 'scale(1.1)', filter: 'blur(10px)', willChange: 'opacity, transform, filter' }}/>
                            )}
                            <div className="absolute inset-0 bg-siteBg-dark opacity-80"></div>
                            <div className="absolute top-0 left-0 w-full h-[150px] md:h-[300px]" style={{ background: 'linear-gradient(to bottom, var(--background-dark) 0%, transparent 100%)' }}></div>
                        </div>
                    </div>

                    <div className="relative z-10">
                        <section className="py-24 md:py-40 bg-transparent">
                            <div className="max-w-4xl mx-auto px-6 text-center">
                                <Reveal direction="up">
                                    <h2 className="text-3xl sm:text-4xl md:text-6xl font-black tracking-tight mb-6 md:mb-8 leading-snug whitespace-pre-wrap text-transparent bg-clip-text bg-gradient-to-r from-primary via-purple-300 to-white drop-shadow-md" style={{ fontFamily: settings?.heroTitleFont || '"Montserrat", sans-serif' }}>
                                        {settings?.ctaTitle || (<>O seu próximo nível exige <br className="hidden sm:block"/> <span className="italic font-serif text-white">uma nova versão</span> de você.</>)}
                                    </h2>
                                    <p className="font-light text-sm md:text-xl mb-10 md:mb-12 max-w-2xl mx-auto whitespace-pre-wrap text-slate-300">
                                        {settings?.ctaSubtitle || "O acesso ao nosso portal é o divisor de águas na sua jornada pessoal. Pare de buscar fora o que já existe dentro."}
                                    </p>
                                    <button onClick={onLoginClick} className="w-full sm:w-auto px-10 md:px-14 py-4 md:py-5 bg-gradient-to-r from-primary to-purple-600 hover:from-primary-hover hover:to-purple-700 text-white font-black uppercase tracking-[0.1em] md:tracking-[0.15em] transition-all duration-500 hover:scale-105 shadow-[0_0_30px_rgba(79,70,229,0.5)] text-xs md:text-sm rounded-md border border-white/10">
                                        {settings?.ctaButtonText || "Garantir Meu Acesso"}
                                    </button>
                                </Reveal>
                            </div>
                        </section>

                        <footer className="bg-transparent pt-16 md:pt-24 pb-12 relative z-20 border-t border-white/[0.05]">
                            <div className="max-w-3xl mx-auto px-6 flex flex-col items-center gap-8">
                                <div>
                                    {footerLogo ? (
                                        <img src={footerLogo} alt="Logo Rodapé" className="h-10 md:h-14 w-auto opacity-80 hover:opacity-100 transition-opacity mx-auto" />
                                    ) : (
                                        <div className="text-xl md:text-2xl font-bold tracking-[0.2em] uppercase text-center text-white" style={{ fontFamily: settings?.siteNameFont ? `"${settings.siteNameFont}", sans-serif` : '"Montserrat", sans-serif' }}>{siteName}</div>
                                    )}
                                </div>
                                <p className="text-xs md:text-sm font-light leading-relaxed max-w-lg text-center whitespace-pre-wrap text-slate-400">
                                    {settings?.footerDescription || 'Instituição dedicada ao despertar humano, unindo alta performance e espiritualidade.'}
                                </p>
                                <div className="flex flex-col items-center gap-4 mt-2">
                                    <span className="text-[10px] font-black uppercase tracking-widest text-primary text-center">Conecte-se conosco</span>
                                    <div className="flex justify-center gap-3 md:gap-4">
                                        {settings?.instagramUrl && (
                                            <a href={settings.instagramUrl} target="_blank" rel="noopener noreferrer" className="p-3 bg-white/5 hover:bg-primary/20 rounded-full text-white/60 hover:text-primary transition-all shadow-sm hover:scale-110 border border-transparent hover:border-primary/50"><Instagram size={18} /></a>
                                        )}
                                        {settings?.tiktokUrl && (
                                            <a href={settings.tiktokUrl} target="_blank" rel="noopener noreferrer" className="p-3 bg-white/5 hover:bg-primary/20 rounded-full text-white/60 hover:text-primary transition-all shadow-sm hover:scale-110 border border-transparent hover:border-primary/50">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
                                            </a>
                                        )}
                                    </div>
                                </div>
                                <div className="w-full h-px bg-white/[0.05] mt-4 mb-2"></div>
                                <p className="text-[9px] md:text-[11px] font-light uppercase tracking-widest text-center text-slate-500">
                                    {settings?.footerCopyright || `© ${new Date().getFullYear()} ${siteName}. Todos os direitos reservados.`}
                                </p>
                            </div>
                        </footer>

                        {settings?.supportPhone && (
                            <a href={`https://wa.me/${settings.supportPhone.replace(/\D/g, '')}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 md:bottom-8 md:right-8 z-50 bg-[#0a0a0a] text-white p-3.5 md:p-4 rounded-full border border-white/20 shadow-[0_0_20px_rgba(0,0,0,0.8)] hover:shadow-[0_0_25px_rgba(79,70,229,0.4)] hover:bg-primary hover:border-primary transition-all duration-300 flex items-center justify-center hover:scale-110 hover:-translate-y-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                            </svg>
                        </a>
                        )}
                    </div>
                </div>
            </div>
        );
    };
    // --- FIM DO COMPONENTE LANDING PAGE ---


    // --- TELA DE LOGIN / CADASTRO (CORRIGIDA - OTIMIZADA PARA CELULAR) ---
    // 👇 NOVO CÓDIGO AQUI 👇
    const AuthScreen = ({ onLogin, onBack, settings }) => {
      const [isLogin, setIsLogin] = useState(true); 
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [isLoaded, setIsLoaded] = useState(false);
      
      const logoUrl = settings?.siteLogoUrl;
      const bgImage = settings?.siteLoginBgUrl;

      // 👇 VALIDADOR DE VÍDEO AQUI 👇
      const isVideo = (url) => {
          if (!url) return false;
          return !!url.toLowerCase().match(/\.(mp4|webm|ogg|mov)(?:\?.*)?$/);
      };

      const [formData, setFormData] = useState({ 
          email: '', password: '', name: ''
      });
      const [showLoginPassword, setShowLoginPassword] = useState(false);

      useEffect(() => {
          const timer = setTimeout(() => setIsLoaded(true), 50); 
          return () => clearTimeout(timer);
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (loading) return;
        setLoading(true); setError('');
        if (!auth) {
            setError("Erro de conexão. Verifique sua internet.");
            setLoading(false); return;
        }

        try {
          if (isLogin) {
            await guardedPasswordSignIn(auth, formData.email, formData.password);
          } else {
             if (!formData.name) throw new Error("Preencha seu nome completo.");
             
             const cred = await window.platformAuthAttempt('registration', () => createUserWithEmailAndPassword(auth, formData.email.trim(), formData.password));
             await updateProfile(cred.user, { displayName: formData.name });
             
             if (db) {
                 await setDoc(doc(db, "users", cred.user.uid), { 
                     name: formData.name, 
                     email: cred.user.email, 
                     role: 'student', 
                     createdAt: serverTimestamp(), 
                     profileComplete: false 
                 });
             }
          }
        } catch (err) { 
            let msg = err.message || "Erro desconhecido";
            const errCode = err.code || "";
            if(errCode === "auth/invalid-credential" || errCode === "auth/user-not-found" || errCode === "auth/wrong-password") {
                msg = "E-mail ou senha incorretos.";
            } else if(errCode === "auth/email-already-in-use") {
                msg = "Este e-mail já possui cadastro.";
            } else if(errCode === "auth/weak-password") {
                msg = "A senha deve ter pelo menos 6 caracteres.";
            }
            setError(msg); setLoading(false); 
        }
      };

      const [googleRetryRedirect, setGoogleRetryRedirect] = useState(false);
      const [googleHelp, setGoogleHelp] = useState('');
      const googleBusy = useRef(false);
      useEffect(() => {
          let active = true;
          platformGoogleRedirectResult.then(({ error }) => { if (active && error) setError(platformGoogleError(error)); });
          return () => { active = false; };
      }, []);
      const handleGoogleLogin = async (redirect = false) => {
        if (loading || googleBusy.current) return;
        if (!auth) return setError('Não foi possível conectar. Confira sua internet.');
        if (platformGoogleInAppBrowser()) {
            setError('O Google pode bloquear o login dentro de aplicativos. Use o menu do aplicativo para abrir esta página no Chrome ou Safari, ou copie o endereço abaixo.');
            setGoogleHelp(window.location.href);
            return;
        }
        googleBusy.current = true;
        setLoading(true); setError(''); setGoogleRetryRedirect(false);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        auth.languageCode = 'pt-BR';
        try {
          // Sem await antes deste comando: preserva a ativação do toque.
          if (redirect && platformCanGoogleRedirect()) {
              await window.platformAuthAttempt('google', () => signInWithRedirect(auth, provider));
          } else {
              const result = await window.platformAuthAttempt('google', () => signInWithPopup(auth, provider));
              await platformEnsureGoogleProfile(result.user);
          }
        } catch (err) {
            setError(platformGoogleError(err));
            setGoogleRetryRedirect(platformCanGoogleRedirect() && ['auth/popup-blocked', 'auth/popup-closed-by-user'].includes(err.code));
        } finally { googleBusy.current = false; setLoading(false); }
      };
      const copyGoogleLoginUrl = async () => {
          try { await navigator.clipboard.writeText(window.location.href); setGoogleHelp('Endereço copiado! Cole na barra de endereços do Chrome ou Safari.'); }
          catch (_) { setGoogleHelp(window.location.href); }
      };

      return (
        <div className={`platform-auth-screen min-h-screen flex items-center justify-center p-4 bg-siteBg-light dark:bg-siteBg-dark relative overflow-hidden font-sans transition-colors duration-300 ${isLoaded ? 'is-loaded' : ''}`}>
          
          {bgImage ? (
              <div className="absolute inset-0 z-0 login-bg-anim">
                  {isVideo(bgImage) ? (
                      <BackgroundVideo src={bgImage} className="w-full h-full object-cover opacity-100" />
                  ) : (
                      <img src={bgImage} className="w-full h-full object-cover opacity-100" alt="Background" />
                  )}
                  <div className="absolute inset-0 bg-slate-900/70 backdrop-blur-sm"></div>
              </div>
          ) : (
              <div className="absolute inset-0 z-0 bg-siteBg-light dark:bg-siteBg-dark login-bg-anim"></div>
          )}

          {/* AQUI FOI FEITA A REDUÇÃO DE TAMANHO (w-[92%] max-w-[340px] sm:max-w-sm) */}
          <div className={`relative z-10 bg-white dark:bg-slate-900 w-[92%] max-w-[340px] sm:max-w-sm rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] overflow-hidden transition-all duration-500 border border-slate-200 dark:border-slate-800 login-card-anim`}>
            
            <div className="px-6 pt-8 pb-2 text-center stagger-item delay-1">
                {logoUrl ? (
                    <img src={logoUrl} alt="Logo" className="h-10 mx-auto mb-5 object-contain" />
                ) : (
                    <div className="w-12 h-12 bg-primary rounded-lg mx-auto flex items-center justify-center font-bold text-xl text-white mb-5 shadow-sm">
                         {(settings?.siteName || "A").charAt(0)}
                    </div>
                )}
                
                <h2 className="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">{isLogin ? 'Bem-vindo de volta' : 'Crie sua conta'}</h2>
                <p className="text-slate-500 dark:text-slate-400 text-xs mt-1.5">{isLogin ? 'Insira seus dados para acessar a plataforma.' : 'Preencha os dados abaixo para iniciar.'}</p>
            </div>

            <div className="px-6 pb-6 pt-4">
                {error && (
                    <div className="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-3 text-xs rounded-lg mb-5 font-medium border border-red-100 dark:border-red-900/50 flex items-start gap-2 stagger-item delay-2">
                        <AlertCircle size={16} className="shrink-0 mt-0.5"/> 
                        <span>{error}</span>
                    </div>
                )}

                {googleHelp && <div className="mb-4 p-3 rounded-xl bg-indigo-500/10 text-sm break-words" role="status"><p>{googleHelp}</p><button type="button" onClick={copyGoogleLoginUrl} className="mt-2 px-3 py-2 border rounded-lg">Copiar endereço para abrir no navegador</button></div>}
                {googleRetryRedirect && <button type="button" disabled={loading} onClick={() => handleGoogleLogin(true)} className="w-full mb-4 p-3 rounded-xl bg-indigo-600 text-white">Continuar com Google nesta aba</button>}
                {isLogin && (
                    <div className="mb-5 stagger-item delay-2">
                        <Button onClick={() => handleGoogleLogin(false)} disabled={loading} variant="secondary" className="w-full h-10 text-xs flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-4 h-4" alt="Google" /> {loading ? 'Conectando…' : 'Continuar com Google'}
                        </Button>
                        <div className="relative flex py-4 items-center">
                            <div className="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                            <span className="flex-shrink-0 mx-3 text-slate-400 text-[9px] font-bold uppercase tracking-widest">Ou com e-mail</span>
                            <div className="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                        </div>
                    </div>
                )}

                <form onSubmit={handleSubmit} className="space-y-5">
                    <div className="space-y-4 stagger-item delay-3">
                        
                        {!isLogin && (
                            <div className="space-y-1.5 text-left">
                                <label className="block text-[10px] font-bold text-primary uppercase tracking-widest ml-1">Nome Completo</label>
                                <input 
                                    type="text" 
                                    value={formData.name} 
                                    onChange={e=>setFormData({...formData, name:e.target.value})} 
                                    className="w-full px-4 py-3 bg-white border border-transparent rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition-all text-sm shadow-inner" 
                                    placeholder="Seu nome e sobrenome" 
                                    required={!isLogin} 
                                />
                            </div>
                        )}

                        <div className="space-y-1.5 text-left">
                            <label className="block text-[10px] font-bold text-primary uppercase tracking-widest ml-1">Endereço de E-mail</label>
                            <input 
                                type="email" 
                                value={formData.email} 
                                onChange={e=>setFormData({...formData, email:e.target.value})} 
                                className="w-full px-4 py-3 bg-white border border-transparent rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition-all text-sm shadow-inner" 
                                placeholder="seu@email.com" 
                                required 
                            />
                        </div>
                        
                        <div className="space-y-1.5 text-left">
                            <label className="block text-[10px] font-bold text-primary uppercase tracking-widest ml-1">Senha de Acesso</label>
                            <div className="relative">
                                <input 
                                    type={showLoginPassword ? "text" : "password"} 
                                    value={formData.password} 
                                    onChange={e=>setFormData({...formData, password:e.target.value})} 
                                    className="w-full pl-4 pr-12 py-3 bg-white border border-transparent rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition-all text-sm tracking-widest shadow-inner" 
                                    placeholder="••••••••" 
                                    required 
                                />
                                <button type="button" onClick={() => setShowLoginPassword(!showLoginPassword)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors">
                                    {showLoginPassword ? <EyeOff size={18}/> : <Eye size={18}/>}
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="stagger-item delay-4 pt-3">
                        <button type="submit" 
                            className="w-full h-12 bg-primary hover:bg-primary-hover text-white font-bold text-base shadow-lg hover:shadow-xl rounded-xl transition-all duration-300 flex items-center justify-center gap-2"
                            disabled={loading}
                        >
                            {loading ? 'Processando...' : (isLogin ? 'Entrar na Plataforma' : 'Criar Minha Conta')}
                        </button>
                    </div>
                </form>
            </div>
            
            <div className="bg-slate-50 dark:bg-slate-800/50 p-4 text-center border-t border-slate-100 dark:border-slate-800 stagger-item delay-5">
                <p className="text-xs text-slate-500 dark:text-slate-400 flex flex-col sm:flex-row items-center justify-center gap-1">
                    <span>{isLogin ? 'Ainda não tem uma conta?' : 'Já possui uma conta?'}</span>
                    <button onClick={()=>{setIsLogin(!isLogin); setError('')}} className="font-bold text-primary hover:underline transition-all">
                        {isLogin ? 'Cadastre-se aqui' : 'Faça login agora'}
                    </button>
                </p>
            </div>

            <div className="p-3 text-center bg-white dark:bg-slate-900 stagger-item delay-5">
                <button onClick={onBack} className="text-slate-400 text-[10px] uppercase font-bold tracking-wider hover:text-primary flex items-center justify-center gap-1 mx-auto transition-colors">
                    <ArrowLeft size={10}/> Voltar ao início
                </button>
            </div>
          </div>
        </div>
      );
    }; 
    // 👆 FIM DO NOVO CÓDIGO 👆

    // --- MODAL DE COMPLETAR CADASTRO (CORRIGIDO - ALTO CONTRASTE) ---
    const CompleteRegistrationModal = ({ user, onSuccess }) => {
        const [formData, setFormData] = useState({
            cpf: '', phone: '', zipCode: '', address: '', number: '', neighborhood: '', city: '', state: '' 
        });
        const [loading, setLoading] = useState(false);

        const handleCpfChange = (e) => {
            let v = e.target.value.replace(/\D/g, '').slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            setFormData(prev => ({ ...prev, cpf: v }));
        };
        const handlePhoneChange = (e) => {
             let v = e.target.value.replace(/\D/g, '').slice(0, 11);
             v = v.replace(/^(\d{2})(\d)/g, '($1) $2').replace(/(\d)(\d{4})$/, '$1-$2');
             setFormData(prev => ({ ...prev, phone: v }));
        };
        const handleCepChange = async (e) => {
            let v = e.target.value.replace(/\D/g, '').slice(0, 8);
            v = v.replace(/^(\d{5})(\d)/, '$1-$2');
            setFormData(prev => ({ ...prev, zipCode: v }));
            if (v.replace(/\D/g, '').length === 8) {
                try {
                    const res = await fetch(`https://viacep.com.br/ws/${v.replace('-','')}/json/`);
                    const data = await res.json();
                    if (!data.erro) setFormData(prev => ({ ...prev, address: data.logradouro, neighborhood: data.bairro, city: data.localidade, state: data.uf }));
                } catch (err) {}
            }
        };

        const handleSave = async (e) => {
            e.preventDefault();
            setLoading(true);
            try {
                await setDoc(doc(db, "users", user.uid), { ...formData, updatedAt: serverTimestamp() }, { merge: true });
                onSuccess();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                window.platformAlert("Erro ao salvar dados.");
            } finally { setLoading(false); }
        };

        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                {/* CORREÇÃO: Fundo escuro (dark:bg-slate-900) e texto claro (dark:text-white) */}
                <div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl p-8 overflow-y-auto max-h-[90vh] border border-transparent dark:border-slate-700">
                    <div className="text-center mb-6">
                        <div className="w-16 h-16 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 rounded-full flex items-center justify-center mx-auto mb-4">
                            <ShieldCheck size={32} />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 dark:text-white">Finalize seu Cadastro</h2>
                        <p className="text-slate-500 dark:text-slate-400 mt-2">Identificamos que faltam alguns dados obrigatórios. Complete abaixo para liberar seu acesso.</p>
                    </div>

                    <form onSubmit={handleSave} className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <Input label="CPF" value={formData.cpf} onChange={handleCpfChange} placeholder="000.000.000-00" required />
                            <Input label="Telefone" value={formData.phone} onChange={handlePhoneChange} placeholder="(00) 00000-0000" required />
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <Input label="CEP" value={formData.zipCode} onChange={handleCepChange} placeholder="00000-000" required />
                            <div className="md:col-span-2">
                                <Input label="Endereço" value={formData.address} onChange={e=>setFormData({...formData, address:e.target.value})} required />
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-4">
                            <Input label="Número" value={formData.number} onChange={e=>setFormData({...formData, number:e.target.value})} required />
                            <Input label="Bairro" value={formData.neighborhood} onChange={e=>setFormData({...formData, neighborhood:e.target.value})} required />
                            <Input label="Cidade" value={formData.city} onChange={e=>setFormData({...formData, city:e.target.value})} required />
                        </div>

                        <Button type="submit" disabled={loading} className="w-full h-12 text-base mt-4 shadow-lg bg-indigo-600 hover:bg-indigo-700">
                            {loading ? 'Salvando...' : 'Confirmar e Acessar'}
                        </Button>
                    </form>
                </div>
            </div>
        );
    };
