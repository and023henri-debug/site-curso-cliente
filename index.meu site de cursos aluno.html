    // --- COMPONENTE DE BARREIRA DE ERRO ---
    // Se algum componente quebrar, isso mostra o erro na tela em vez de deixar tudo branco.
    class ErrorBoundary extends React.Component {
        constructor(props) {
            super(props);
            this.state = { hasError: false, error: null, errorInfo: null };
        }

        static getDerivedStateFromError(error) {
            return { hasError: true, error };
        }

        componentDidCatch(error, errorInfo) {
            console.error("ERRO CRÍTICO REACT:", error, errorInfo);
            this.setState({ errorInfo });
        }

        render() {
            if (this.state.hasError) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-red-50 p-8 font-sans">
                        <div className="bg-white p-8 rounded-2xl shadow-xl border border-red-200 max-w-2xl w-full text-center">
                            <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <AlertCircle size={32} />
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">Ops! Ocorreu um erro.</h2>
                            <p className="text-slate-600 mb-6">O sistema encontrou um problema técnico.</p>
                            
                            <div className="bg-slate-900 text-left p-4 rounded-lg overflow-auto mb-6 border border-slate-700 max-h-60">
                                <p className="text-red-400 font-mono text-xs font-bold mb-2">Erro Técnico:</p>
                                <pre className="text-white font-mono text-xs whitespace-pre-wrap">
                                    {this.state.error && this.state.error.toString()}
                                </pre>
                            </div>

                            <button onClick={() => window.location.reload()} className="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all">
                                Tentar Recarregar
                            </button>
                        </div>
                    </div>
                );
            }
            return this.props.children; 
        }
    }

const platformHasVisibleLesson = () => {
    if (document.visibilityState === 'visible') return true;

    catch (_) { return false; }
};
const inactivityStudentCall = async (name,data={}) => (await httpsCallable(getFunctions(app,'southamerica-east1'),name,{timeout:20000})(data)).data;
function InactivityGate({user,children}) {
    const [access,setAccess]=React.useState(null), [error,setError]=React.useState('');
    const [checking,setChecking]=React.useState(true), [sending,setSending]=React.useState(false);
    const [message,setMessage]=React.useState('');
    const alive=React.useRef(true), inFlight=React.useRef(null), version=React.useRef(0);
    const check=async (foreground=false) => {
        if (foreground) {version.current++;setChecking(true);}
        if (inFlight.current) { await inFlight.current; if (!alive.current) return; }
        // Uma mudança de visibilidade exige uma nova decisão após qualquer chamada antiga.
        if (!foreground && !platformHasVisibleLesson()) return;
        const generation=version.current;
        const job=(async()=>{
            try {
                const result=await inactivityStudentCall('inactivityAccess',{mode:platformHasVisibleLesson()?'heartbeat':'inspect'});
                if(alive.current && generation===version.current) {setAccess(result);setError('');setChecking(false);}
            } catch(e) {
                if(alive.current && generation===version.current) {setError('Não foi possível verificar seu acesso. Confira sua conexão e tente novamente.');setChecking(false);}
            }
        })();
        inFlight.current=job;
        await job;
        if(inFlight.current===job) inFlight.current=null;
    };
    React.useEffect(()=>{
        alive.current=true;check(true);
        const timer=setInterval(()=>check(),20000);
        const visibility=()=>{if(document.visibilityState==='visible') check(true);};
        const online=()=>check(true);
        document.addEventListener('visibilitychange',visibility);window.addEventListener('online',online);window.addEventListener('platform:lesson-window',online);
        return ()=>{alive.current=false;version.current++;clearInterval(timer);document.removeEventListener('visibilitychange',visibility);window.removeEventListener('online',online);window.removeEventListener('platform:lesson-window',online);};
    },[user.uid]);

    };

       // 👆 FIM DO MOTOR DA IA 👆

       // --- INÍCIO DO MOTOR DE TEMA DINÂMICO ---
      const applyThemeToDOM = (settings) => {
          if (!settings) return;
          const root = document.documentElement;

          const darkenHex = (hex, percent) => {
              if (!hex) return '#000000';
              hex = hex.replace('#', '');
              if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
              let r = parseInt(hex.substring(0, 2), 16);
              let g = parseInt(hex.substring(2, 4), 16);
              let b = parseInt(hex.substring(4, 6), 16);
              r = Math.max(0, Math.floor(r * (100 - percent) / 100));
              g = Math.max(0, Math.floor(g * (100 - percent) / 100));
              b = Math.max(0, Math.floor(b * (100 - percent) / 100));
              return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
          };

          // Aplica todas as cores
          if (settings.colorPrimary) {
              root.style.setProperty('--color-primary', settings.colorPrimary);
              root.style.setProperty('--color-primary-hover', darkenHex(settings.colorPrimary, 15)); 
              root.style.setProperty('--color-primary-soft', settings.colorPrimary + '26'); 
          }
          if (settings.colorSecondary) root.style.setProperty('--color-secondary', settings.colorSecondary);
          if (settings.colorBgLight) root.style.setProperty('--background-light', settings.colorBgLight);
          if (settings.colorBgDark) root.style.setProperty('--background-dark', settings.colorBgDark);
          if (settings.colorTextLight) root.style.setProperty('--text-light', settings.colorTextLight);
          if (settings.colorTextDark) root.style.setProperty('--text-dark', settings.colorTextDark);
          if (settings.colorTitleLight) root.style.setProperty('--title-light', settings.colorTitleLight);
          if (settings.colorTitleDark) root.style.setProperty('--title-dark', settings.colorTitleDark);
          if (settings.colorSubtitleLight) root.style.setProperty('--subtitle-light', settings.colorSubtitleLight);
          if (settings.colorSubtitleDark) root.style.setProperty('--subtitle-dark', settings.colorSubtitleDark);

          // Aplica fontes com peso completo (sem dar erro de weight missing)
          const loadGoogleFont = (fontName) => {
              if (!fontName) return;
              const fontId = `gfont-${fontName.replace(/\s+/g, '-').toLowerCase()}`;
              const am = String.fromCharCode(38);
              if (!document.getElementById(fontId)) {
                  const link = document.createElement('link');
                  link.id = fontId; 
                  link.rel = 'stylesheet';
                  link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}:wght@300;400;500;600;700;800;900${am}display=swap`;
                  document.head.appendChild(link);
              }
          };
          
          [settings.siteNameFont, settings.heroTitleFont, settings.heroSubtitleFont, settings.bodyFont].forEach(loadGoogleFont);
      };

      // 1. CARREGAMENTO EM TEMPO REAL DO BANCO DE DADOS
      useEffect(() => {
          let unsubSettings;
          
          if (typeof isFirebaseAvailable !== 'undefined' && isFirebaseAvailable && db) {
              const docRef = doc(db, "config", "general_settings");
              unsubSettings = onSnapshot(docRef, (docSnap) => {
                  if (docSnap.exists()) {
                      const data = docSnap.data();
                      setGenSettings(data);

                      // Atualiza o tema e o manifesto
                      if (window.applyTheme) window.applyTheme(data);
                      if (window.applyPwaManifest) window.applyPwaManifest(data);

                      // MOTOR DE IDENTIDADE DINÂMICA (FAVICON = LOGÓTIPO DO SITE)
                      const siteLogo = data.siteLogoUrl || data.logoUrl || data.pwaIconUrl;
                      if (siteLogo) {
                          // 1. Atualiza ou cria o Favicon (Ícone da Aba)
                          let favicon = document.querySelector('link[rel="icon"]');
                          if (!favicon) {
                              favicon = document.createElement('link');
                              favicon.rel = 'icon';
                              document.head.appendChild(favicon);
                          }
                          favicon.href = siteLogo;

                          // 2. Atualiza ou cria o Apple Touch Icon (iOS)
                          let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
                          if (!appleIcon) {
                              appleIcon = document.createElement('link');
                              appleIcon.rel = 'apple-touch-icon';
                              document.head.appendChild(appleIcon);
                          }
                          appleIcon.href = data.pwaIconUrl || siteLogo;
                      }

                      setTimeout(() => {
                          if (window.initMeusCursosCarousel) {
                              window.initMeusCursosCarousel(true, data.landingVideos);
                          }
                      }, 500);

                      const heroImgUrl = data.heroBgUrl || data.heroBackground;
                      if (heroImgUrl) {
                          const img = new Image();
                          img.src = heroImgUrl;
                          img.onload = () => setBgLoaded(true);
                          img.onerror = () => setBgLoaded(true); 
                      } else {
                          setBgLoaded(true);
                      }
                  }
              }, (error) => console.warn("Erro ao ouvir config em tempo real:", error));
          }

          if (typeof isFirebaseAvailable !== 'undefined' && isFirebaseAvailable && db) {
              try {
                 const unsubCerts = onSnapshot(collection(db, "certificates"), (snap) => {
                     setCertificados(snap.docs.map(d => ({id: d.id, ...d.data()})));
                 }, (error) => console.log("Erro Certificados:", error));

                 const qCourses = query(collection(db, "courses"), where("ativo", "==", true));
                 const unsubCourses = onSnapshot(qCourses, (snap) => {
                     setCursos(snap.docs.map(d => ({id: d.id, ...d.data()})));
                 });

                 // 👇 BUSCA PROMOÇÕES AQUI PARA O APP INTEIRO 👇
                 const qPromos = query(collection(db, "promotions"), where("active", "==", true));
                 const unsubPromos = onSnapshot(qPromos, (snap) => {
                     setPromocoes(snap.docs.map(d => ({id: d.id, ...d.data()})));
                 });

                 return () => { unsubCerts(); unsubCourses(); unsubPromos(); if(unsubSettings) unsubSettings(); };
              } catch(e) { console.log("Erro listeners firestore", e); }
          }
      }, []);

      // 2. MODO PREVIEW AO VIVO E HANDSHAKE (Gatilho Inteligente)
      useEffect(() => {
          const handleMessage = (event) => {
              if (event.data && event.data.type === 'UPDATE_PREVIEW') {
                  const newSettings = event.data.settings;
                  
                  // Forçamos a leitura das variáveis corretas caso os nomes venham diferentes
                  const mappedSettings = {
                      ...newSettings,
                      colorPrimary: newSettings.colorPrimary || newSettings.sitePrimaryColor,
                      colorSecondary: newSettings.colorSecondary || newSettings.siteSecondaryColor
                  };
                  
                  setGenSettings(prev => ({ ...prev, ...mappedSettings }));
                  applyThemeToDOM(mappedSettings); 
              }
          };
          window.addEventListener('message', handleMessage);
          
          // O SEGREDO: O Iframe avisa o Painel Admin que ele terminou de montar o React e está pronto!
          if (isPreview) {
              window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
          }
          
          return () => window.removeEventListener('message', handleMessage);
      }, [isPreview]); 
      // --- FIM DO MOTOR DE TEMA DINÂMICO ---

       // --- MODO PREVIEW FORÇADO (Detecta se está dentro do Iframe do Admin) ---
       const urlParams = new URLSearchParams(window.location.search);
       const isPreview = urlParams.get('preview');

       // 2. Autenticação com Timeout de Segurança (Desativado no modo Preview)
       useEffect(() => {
         // Se estiver em modo preview, não precisa autenticar nem carregar
         if (isPreview) {
             setLoading(false);
             return;
         }

         let unsubscribeAuth;
         
         // A) Tenta conectar com Firebase Auth
         if (typeof isFirebaseAvailable !== 'undefined' && isFirebaseAvailable && auth) {
             unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
               setUser(currentUser);
               if (currentUser) setShowAuth(false);
               setLoading(false); // Sucesso
             }, (error) => {
                 console.error("Erro Auth:", error);
                 setLoading(false); // Erro, mas libera o load
             });
         } else {
             // Se não tiver firebase, libera o load após um breve delay
             setTimeout(() => setLoading(false), 1000);
         }
         
         // B) TRAVA DE SEGURANÇA (TIMEOUT)
         const safetyTimer = setTimeout(() => {
             if (loading) {
                 console.warn("⚠️ Timeout de Carregamento: Forçando abertura.");
                 setLoading(false);
             }
         }, 7000); 

         return () => { 
             if(unsubscribeAuth) unsubscribeAuth(); 
             clearTimeout(safetyTimer);
         };
       }, [loading, isPreview]);

       // =======================================================
       // ROTEAMENTO DE TELAS E MODO PREVIEW
       // =======================================================

       // 1. SE ESTIVER NO MODO PREVIEW (Vindo do Painel Admin)
       if (isPreview) {

               return <AuthScreen onLogin={() => {}} onBack={() => {}} settings={genSettings} />;

       }

       // 2. TELA DE CARREGAMENTO NEUTRA
       if (loading) {
           return (
               <div className="flex flex-col items-center justify-center min-h-screen bg-[#050505] transition-colors duration-300">
                   <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                   <p className="text-gray-300 font-medium animate-pulse">
                       Carregando Sistema...
                   </p>
               </div>
           );
       }

       // 3. FLUXO NORMAL DA APLICAÇÃO (Aluno Autenticado ou Visitante)
       // 👇 AQUI A MÁGICA FINAL: O APP PASSA A LISTA DE PROMOÇÕES (promotions={promocoes}) PARA O DASHBOARD 👇
       if (user) {
           return <InactivityGate key={user.uid} user={user}><StudentDashboard user={user} settings={genSettings} certificates={certificados} promotions={promocoes} onLogout={() => { if(auth) signOut(auth); else setUser(null); }} /></InactivityGate>;
       }
       
       if (showAuth) {
           return <AuthScreen onLogin={(u) => setUser(u)} onBack={() => setShowAuth(false)} settings={genSettings} />;
       }
       
       // 4. TRAVA DE SEGURANÇA CONTRA TELA PISCANDO
       if (!genSettings || (!user && !showAuth && !bgLoaded)) {
           return (
               <div className="flex flex-col items-center justify-center min-h-screen bg-[#050505]">
                   <div className="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
               </div>
           );
       }

       return <PublicLanding onLoginClick={() => setShowAuth(true)} settings={genSettings} courses={cursos} promotions={promocoes} />;
       // 👆 FIM DO BLOCO DE CARREGAMENTO E ROTEAMENTO 👆
    };
    
    try {
        const container = document.getElementById('root');
        if (container) {
            const root = createRoot(container);
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>

            console.log("React montado com sucesso.");
        } else {

        document.body.innerHTML = "<h1 style='color:red; text-align:center; padding: 20px;'>Erro fatal ao carregar a plataforma. Verifique o console do navegador.</h1>";
    }

                <div id="aem-typing-indicator" class="hidden flex gap-2 w-full mt-2">
                    <div class="w-6 h-6 shrink-0 rounded-full bg-blue-500/20 flex items-center justify-center text-[#3b82f6] text-[10px] overflow-hidden" id="aem-typing-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-gray-800 p-2 rounded-xl rounded-tl-none border border-gray-700 flex items-center gap-1 w-12 h-8">
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full aem-typing-dot"></div>
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full aem-typing-dot"></div>
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full aem-typing-dot"></div>
                    </div>
                </div>
            </div>

            <div class="p-3 bg-gray-900 border-t border-gray-700 shrink-0 rounded-b-2xl">
                <form id="aem-ia-form" class="flex items-center gap-2">
                    <button type="button" id="aem-mic-btn" onclick="window.AemIaWidget.toggleVoice()" class="w-10 h-10 shrink-0 rounded-full bg-gray-800 border border-gray-600 hover:bg-gray-700 text-gray-300 flex items-center justify-center transition-all shadow-md"><i class="fa-solid fa-microphone text-sm"></i></button>
                    <input type="text" id="aem-ia-input" placeholder="Escreva ou fale..." class="flex-1 bg-gray-800 text-white text-sm rounded-full px-4 py-2.5 border border-gray-600 focus:outline-none focus:border-[#3b82f6] transition-all" required autocomplete="off">
                    <button type="submit" id="aem-ia-btn" class="w-10 h-10 shrink-0 rounded-full bg-[#3b82f6] hover:bg-[#2563eb] text-white flex items-center justify-center transition-transform hover:scale-105"><i class="fa-solid fa-paper-plane text-sm"></i></button>
                </form>
                <div class="text-center mt-1"><span id="aem-mic-status" class="text-[9px] text-red-400 font-bold hidden animate-pulse">Ouvindo...</span></div>
            </div>
        </div>
    `;
    document.body.appendChild(root);

    // 👇 INÍCIO DA LÓGICA DE MOVIMENTAÇÃO DO BOTÃO (DRAG AND DROP) 👇
    const fab = document.getElementById('aem-chat-fab');
    let isDragging = false;
    let dragged = false;
    let startX, startY, initialLeft, initialTop;

    // Configura as transições base para cor e sombra, SEM afetar top/left/right/bottom
    fab.style.transition = 'background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease';

    const onDragStart = (e) => {
        if (e.type === 'touchstart') {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        } else {
            startX = e.clientX;
            startY = e.clientY;
            e.preventDefault(); // Evita seleção de texto no PC
        }

        const rect = fab.getBoundingClientRect();
        
        // Remove right/bottom nativos do Tailwind e converte pra coordenadas absolutas left/top
        fab.style.right = 'auto';
        fab.style.bottom = 'auto';
        fab.style.left = rect.left + 'px';
        fab.style.top = rect.top + 'px';
        
        initialLeft = rect.left;
        initialTop = rect.top;
        
        isDragging = true;
        dragged = false; // Reset da trava de clique
        
        fab.style.transition = 'none'; // Desliga a transição para seguir o dedo suavemente

        document.addEventListener('mousemove', onDragMove, { passive: false });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('mouseup', onDragEnd);
        document.addEventListener('touchend', onDragEnd);
    };

    const onDragMove = (e) => {
        if (!isDragging) return;

        let clientX, clientY;
        if (e.type === 'touchmove') {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        const dx = clientX - startX;
        const dy = clientY - startY;

        // Se moveu mais que 5 pixels, consideramos como "arrastar" e não "clique"
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            dragged = true;
        }

        if (dragged) {
            e.preventDefault(); // Impede a tela de rolar no celular enquanto arrasta
            
            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;

            // Limites da tela para o botão não sumir pra fora
            const maxLeft = window.innerWidth - fab.offsetWidth;
            const maxTop = window.innerHeight - fab.offsetHeight;

            newLeft = Math.max(0, Math.min(newLeft, maxLeft));
            newTop = Math.max(0, Math.min(newTop, maxTop));

            fab.style.left = newLeft + 'px';
            fab.style.top = newTop + 'px';
        }
    };

    const onDragEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        
        // Volta a transição de cores e sombra
        fab.style.transition = 'background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease';

        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('touchmove', onDragMove);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchend', onDragEnd);
    };

    // Anexa os eventos de Mouse e Touch
    fab.addEventListener('mousedown', onDragStart);
    fab.addEventListener('touchstart', onDragStart, { passive: false });

    // Lógica para separar CLIQUE de ARRASTAR
    fab.addEventListener('click', (e) => {
        if (dragged) {
            // Se ele arrastou o botão, anula o clique
            e.preventDefault();
            e.stopPropagation();
        } else {
            // Se foi só um clique rápido, abre a IA
            window.AemIaWidget.toggleWidget();
        }
    });
    // 👆 FIM DA LÓGICA DO BOTÃO ARRASTÁVEL 👆

    // Lógica de UI do Widget
    let isWidgetOpen = false;
    
    window.AemIaWidget.openWidget = () => {
        isWidgetOpen = true;
        document.getElementById('aem-chat-widget').classList.remove('hidden', 'aem-widget-exit');
        document.getElementById('aem-chat-widget').classList.add('aem-widget-enter');
        document.getElementById('aem-chat-fab').style.transform = 'scale(0)';
        setTimeout(() => document.getElementById('aem-ia-input').focus(), 300);
    };

    window.AemIaWidget.closeWidget = () => {
        isWidgetOpen = false;
        document.getElementById('aem-chat-widget').classList.remove('aem-widget-enter');
        document.getElementById('aem-chat-widget').classList.add('aem-widget-exit');
        document.getElementById('aem-chat-fab').style.transform = 'scale(1)';
        setTimeout(() => document.getElementById('aem-chat-widget').classList.add('hidden'), 300);
    };

    window.AemIaWidget.toggleWidget = () => {
        if (isWidgetOpen) window.AemIaWidget.closeWidget();
        else window.AemIaWidget.openWidget();
    };

    // 👇 INÍCIO DO CÓDIGO DE VOZ OTIMIZADO 👇
    let recognition = null, isListening = false, autoSendTimer = null;
    const micBtn = document.getElementById('aem-mic-btn'), micStatus = document.getElementById('aem-mic-status');

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.interimResults = true; // Permite ver o texto enquanto fala
        recognition.lang = 'pt-BR';

        recognition.onstart = function() {
            isListening = true; 
            micBtn.classList.replace('bg-gray-800', 'bg-red-500'); 
            micBtn.classList.replace('text-gray-300', 'text-white');
            micStatus.classList.remove('hidden'); 
            clearTimeout(autoSendTimer);
        };
        
        recognition.onresult = function(event) {
            clearTimeout(autoSendTimer); 
            let transcriptText = '';
            let isFinal = false;

            // Pega o resultado com máxima precisão
            for (let i = 0; i < event.results.length; ++i) {
                transcriptText += event.results[i][0].transcript;
                if (event.results[i].isFinal) isFinal = true;
            }
            
            document.getElementById('aem-ia-input').value = transcriptText;

           // Só envia automaticamente se a IA tiver certeza que o usuário parou de falar (isFinal)
            if (isFinal) {
                autoSendTimer = setTimeout(() => {
                    if (document.getElementById('aem-ia-input').value.trim() !== '') {
                        if (isListening) recognition.stop();
                        document.getElementById('aem-ia-btn').click(); 
                    }
                }, 300); // ⚡ Acelerado para 300ms de respiro
            }
        };
        recognition.onend = stopListening;
    } else { 
        micBtn.style.display = 'none'; 
    }

    function stopListening() {
        isListening = false; 
        clearTimeout(autoSendTimer);
        micBtn.classList.replace('bg-red-500', 'bg-gray-800'); 
        micBtn.classList.replace('text-white', 'text-gray-300');
        micStatus.classList.add('hidden');
    }

    window.AemIaWidget.toggleVoice = () => {
        if (!recognition) return window.platformAlert("Microfone não suportado no seu navegador.");
        if (isListening) recognition.stop();
        else { document.getElementById('aem-ia-input').value = ''; recognition.start(); }
    };
    // 👆 FIM DO CÓDIGO DE VOZ OTIMIZADO 👆

    // Integração com Backend e Leitura do Site
    function getSiteMap() {
        const elements = document.querySelectorAll('button, a');
        let map = [];
        elements.forEach((el, index) => {
            if(el.closest('#aem-ia-root')) return; // Ignora o próprio widget
            let id = el.id || `ia-target-${index}`; el.id = id;
            let text = el.innerText || el.getAttribute('aria-label') || '';
            text = text.trim().substring(0, 50).replace(/\n/g, ' ');
            if(text) map.push(`{ id: "${id}", tag: "${el.tagName.toLowerCase()}", texto: "${text}" }`);
        });
        return map.join('\n');
    }

    function appendMessage(text, isUser) {
        const box = document.getElementById('aem-chat-box-normal');
        const div = document.createElement('div');
        div.className = `flex gap-2.5 w-full ${isUser ? 'flex-row-reverse' : ''}`;
        
        // Mágica: Puxa a foto salva da IA. Se der erro na imagem, volta o robô padrão.
        const aiAvatarHtml = window.AemIaAvatarUrl && window.AemIaAvatarUrl.length > 5
            ? `<div class="w-8 h-8 rounded-full overflow-hidden shrink-0 border border-blue-500/30 shadow-md bg-blue-500/10 flex items-center justify-center"><img src="${window.AemIaAvatarUrl}" class="w-full h-full object-cover" onerror="this.onerror=null; this.outerHTML='<i class=\\'fa-solid fa-robot text-[#3b82f6] text-xs\\'></i>';" /></div>` 
            : `<div class="w-8 h-8 rounded-full bg-blue-500/20 text-[#3b82f6] flex items-center justify-center shrink-0 border border-blue-500/30 shadow-md"><i class="fa-solid fa-robot text-xs"></i></div>`;
            
        const avatar = isUser ? `<div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-white shrink-0 shadow-md"><i class="fa-solid fa-user text-xs"></i></div>` : aiAvatarHtml;
        
        const contentCls = isUser ? `bg-[#3b82f6] text-white p-3.5 rounded-2xl rounded-tr-none max-w-[85%] shadow-md` : `bg-gray-800 text-white p-3.5 rounded-2xl rounded-tl-none max-w-[85%] border border-gray-700 shadow-md`;
        
        div.innerHTML = `${avatar}<div class="${contentCls}">${text.replace(/\n/g, '<br>')}</div>`;
        box.appendChild(div);
        
        // Rola o chat para o fundo suavemente
        const wrapper = document.getElementById('aem-chat-boxes-wrapper');
        if (wrapper) wrapper.scrollTop = wrapper.scrollHeight;
    }

   // 👇 INÍCIO DO SUPER MOTOR DE IA DE COMANDOS TOTAIS 👇
    // Proteção contra duplicação de ouvintes de eventos (Corrige o erro de mensagens duplicadas)
    const iaForm = document.getElementById('aem-ia-form');
    if (iaForm && !iaForm.dataset.listenerActive) {
        iaForm.dataset.listenerActive = 'true';
        iaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('aem-ia-input');
        const userMsg = input.value.trim();
        if (!userMsg) return;
        
        input.value = '';
        appendMessage(userMsg, true);
        
        const typing = document.getElementById('aem-typing-indicator');
        if (typing) {
            document.getElementById('aem-chat-boxes-wrapper').appendChild(typing);
            typing.classList.remove('hidden');
        }
        
        const backendUrl = "https://meu-backend-ia.vercel.app"; 
        
        try {
            const nomeDaIA = window.AemIaName || "Assistente Virtual";
            const nomeDaPlataforma = window.AemPlatformName || "Plataforma de Estudos";
            const conhecimentoExtra = window.AemIaSystemPrompt || ""; 

            // CÉREBRO CONVERSACIONAL COM IDENTIDADE A&M Produções E HISTÓRICO
            const systemPrompt = `Você é a ${nomeDaIA}, assistente inteligente e amigável da ${nomeDaPlataforma}.
Fui desenvolvida pela A&M Produções.

${conhecimentoExtra}

[DIRETRIZES DE COMPORTAMENTO]:
1. CONVERSE NORMALMENTE: Aja como um humano prestativo. Se o aluno disser "Oi" ou saudações, responda de forma calorosa e humana: "Olá! Como você está se sentindo hoje? No que posso te ajudar?". 
2. SEM PRECONCEITOS EMOCIONAIS: É terminantemente proibido assumir estados de tristeza ou tirar conclusões sobre o humor do usuário antes que ele se expresse claramente.
3. NÃO REPETIR: Você não deve repetir a mensagem enviada pelo usuário, apenas responda-a.
2. PROIBIDO CÓDIGO: Não gere, explique ou corrija códigos de programação (HTML, CSS, JS). Se pedirem, mude de assunto educadamente.
3. IDENTIDADE: Se perguntarem quem te criou, responda apenas: "Fui desenvolvida pela A&M Produções para auxiliar nos seus estudos."

[COMANDOS EXTRAS]:
Se o aluno der uma ORDEM DIRETA (ex: "Abra o curso", "Vá para a loja", "Poste na comunidade"), responda conversando E inclua UM bloco JSON no final.
Se for apenas bate-papo ou dúvida, APENAS converse, NÃO mande JSON.
JSON Permitidos (Siga exatamente estes formatos):
1. NAVEGAR: {"action": "navigate", "target": "ID_DA_TELA"}
   (Use APENAS um destes IDs: home = Início, catalog = Portais, my_courses = Meus Cursos, loja = Loja VIP, favorites = Favoritos, certificates = Conquistas, community = Comunidade, support = Suporte, profile = Perfil, wallet = Carteira/Pontos, informacoes = Sobre Nós/Políticas)
2. ABRIR CURSO: {"action": "open_course", "courseName": "NOME DO CURSO"}
3. COMPRAR/LOJA: {"action": "buy_course", "courseName": "NOME"} ou {"action": "buy_product", "productName": "NOME"}
4. CONTROLAR VÍDEO: {"action": "video_control", "command": "play"} (Opções: play, pause, skip_forward, skip_backward)
5. ATUALIZAR PERFIL DO ALUNO: {"action": "edit_profile", "field": "name", "value": "NOVO VALOR"}
6. POSTAR NA COMUNIDADE: {"action": "post_community", "text": "TEXTO DA POSTAGEM"}
7. FAZER ANOTAÇÃO/RESUMO: {"action": "take_notes", "courseName": "NOME DO CURSO", "notes": "RESUMO GERADO AQUI EM HTML"}`;         
            
            // 🧠 LÓGICA DE MEMÓRIA DA IA (HISTÓRICO)
            let chatHistory = JSON.parse(localStorage.getItem('aem_ia_chat_history')) || [];
            chatHistory.push(`Aluno: ${userMsg}`);
            // Lembra das últimas 8 mensagens para não pesar o sistema
            if (chatHistory.length > 8) chatHistory = chatHistory.slice(chatHistory.length - 8); 
            
            const payload = `${systemPrompt}\n\n[HISTÓRICO DA CONVERSA]:\n${chatHistory.join('\n')}\n\n[NOVA MENSAGEM DO ALUNO]:\n${userMsg}\nResponda de forma natural e contínua:`;
            
            const response = await fetch(`${backendUrl}/api/chat`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: payload })
            });
            
            const data = await response.json();
            typing.classList.add('hidden');
            
            let aiReply = data.reply || "Ação processada.";
            
            // 👇 GATILHO DE EXECUÇÃO TOTAL 👇
            let cmdObj = null;
            let stringToHide = "";
            let blockMatch = aiReply.match(/```[a-z]*\s*(\{[\s\S]*?\})\s*```/i) || aiReply.match(/\{[\s\S]*"action"[\s\S]*\}/i);
            
            if (blockMatch) {
                stringToHide = blockMatch[0];
                try { cmdObj = JSON.parse(blockMatch[1] || blockMatch[0]); } catch(e) {}
            }

            if (cmdObj && cmdObj.action) {
                aiReply = aiReply.replace(stringToHide, '').trim();
                let commandExecuted = false;
                let shouldCloseWidget = false;

                if (window.AemGlobalAPI) {
                    switch(cmdObj.action) {
                        case 'navigate':
                            window.AemGlobalAPI.navigate(cmdObj.target);
                            commandExecuted = true;
                            if (cmdObj.target === 'catalog' || cmdObj.target === 'home') {
                                shouldCloseWidget = true;
                            }
                            break;
                        case 'open_course':
                            const result = window.AemGlobalAPI.openCourseByName(cmdObj.courseName);
                            if (result.status === 'not_found') aiReply += "<br><br><small style='color:#f87171'>Não encontrei nenhum portal com esse nome exato.</small>";
                            else if (result.status === 'multiple') aiReply += `<br><br><small style='color:#fbbf24'>Encontrei várias opções. Qual destes você quer?<br>• ${result.data.join('<br>• ')}</small>`;
                            else { aiReply += `<br><br><small style='color:#4ade80'>Abrindo o portal ${result.data}...</small>`; commandExecuted = true; } 
                            break;
                        case 'buy_course':
                            const boughtC = window.AemGlobalAPI.buyCourseByName(cmdObj.courseName);
                            if (!boughtC) aiReply += "<br><br><small style='color:#f87171'>Não encontrei este curso.</small>";
                            else if (boughtC === 'owned') { aiReply += "<br><br><small style='color:#4ade80'>Você já tem acesso! Abrindo...</small>"; commandExecuted = true; }
                            else { commandExecuted = true; }
                            break;
                        case 'buy_product':
                            window.AemGlobalAPI.navigate('loja');
                            setTimeout(() => {
                                if (window.AemGlobalAPI_Marketplace) window.AemGlobalAPI_Marketplace.buyProductByName(cmdObj.productName);
                            }, 1000);
                            commandExecuted = true;
                            break;
                        case 'video_control':
                            if (window.AemVideoControl) {
                                if (cmdObj.command === 'play') window.AemVideoControl.play();
                                else if (cmdObj.command === 'pause') window.AemVideoControl.pause();
                                else if (cmdObj.command === 'skip_forward') window.AemVideoControl.skip(10);
                                else if (cmdObj.command === 'skip_backward') window.AemVideoControl.skip(-10);
                                commandExecuted = true;
                            } else aiReply += "<br><br><small style='color:#f87171'>Nenhum vídeo em reprodução.</small>";
                            break;
                        case 'edit_profile':
                            const profRes = await window.AemGlobalAPI.updateProfileData(cmdObj.field, cmdObj.value);
                            if(profRes) aiReply += `<br><br><small style='color:#4ade80'>Perfil atualizado! Trocamos ${cmdObj.field} para "${cmdObj.value}".</small>`;
                            else aiReply += "<br><br><small style='color:#f87171'>Houve um erro ao atualizar o banco de dados.</small>";
                            commandExecuted = true;
                            break;
                        case 'post_community':
                            const postRes = await window.AemGlobalAPI.postToCommunity(cmdObj.text);
                            if(postRes) aiReply += `<br><br><small style='color:#4ade80'>Mensagem publicada na comunidade!</small>`;
                            commandExecuted = true;
                            break;
                        case 'take_notes':
                            const noteRes = await window.AemGlobalAPI.takeNotesAutomated(cmdObj.courseName, cmdObj.notes);
                            if(noteRes === 'sucesso') { aiReply += `<br><br><small style='color:#4ade80'>Anotação criada e salva no seu diário de bordo premium deste curso!</small>`; commandExecuted = true; }
                            else aiReply += "<br><br><small style='color:#f87171'>Não encontrei o curso para salvar a anotação.</small>";
                            break;
                    }
                }

                if (commandExecuted) {
                    aiReply += "<br><br><small style='color:#4ade80'><i class='fa-solid fa-bolt'></i> Ação concluída com sucesso!</small>";
                    if (shouldCloseWidget) {
                        setTimeout(() => { window.AemIaWidget.closeWidget(); }, 2000);
                    }
                }
            } else {
                aiReply = aiReply.replace(/```[\s\S]*?```/g, '').trim();
            }
            
            appendMessage(aiReply.trim(), false);
            
            // 💾 SALVA A RESPOSTA DA IA NO HISTÓRICO PARA ELA LEMBRAR DEPOIS
            chatHistory.push(`${nomeDaIA}: ${aiReply.replace(/<[^>]*>?/gm, '')}`); // Remove HTML antes de salvar
            localStorage.setItem('aem_ia_chat_history', JSON.stringify(chatHistory));
            
        } catch (err) {
            typing.classList.add('hidden');
            appendMessage("⚠️ Sistema offline ou falha na conexão.", false);
        }
    });
    }
    
    // 👇 INÍCIO DA LÓGICA DO BOTÃO NOVA CONVERSA 👇
    const btnRestartIa = document.getElementById('aem-ia-restart-btn');
    if (btnRestartIa) {
        btnRestartIa.addEventListener('click', () => {
            // 1. Limpa visualmente as mensagens da tela 
            const chatBody = document.getElementById('aem-chat-box-normal');
            if (chatBody) {
                chatBody.innerHTML = ''; 
            }
            
            // 2. Limpa a memória salva no navegador
            localStorage.removeItem('aem_ia_chat_history'); 
            
            // 3. Adiciona um feedback visual no botão de rodar
            btnRestartIa.classList.add('animate-spin');
            setTimeout(() => btnRestartIa.classList.remove('animate-spin'), 500);

            // 4. Manda a IA dar as boas-vindas oficiais puxadas do Banco de Dados
            setTimeout(() => {
                const msgOficial = window.AemIaWelcomeMsg || "Olá! Como posso te ajudar hoje?";
                appendMessage(msgOficial, false);
            }, 300);
        });
    }
    
    
})();
  </script>
</body>
